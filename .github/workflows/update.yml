name: Update board data

on:
  workflow_dispatch:
  schedule:
    - cron: "7 */3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update data
        run: python update_data.py

      - name: Commit data
        run: |
          git config user.name "daily-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update board data"
          git push
