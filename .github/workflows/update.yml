name: Update board data


on:
  workflow_dispatch:
  schedule:
    # 日本時間（JST = UTC+9）
    - cron: "5 0 * * 1-5"    # 09:05
    - cron: "0 1 * * 1-5"    # 10:00
    - cron: "0 2 * * 1-5"    # 11:00
    - cron: "35 3 * * 1-5"   # 12:35
    - cron: "30 4 * * 1-5"   # 13:30
    - cron: "30 5 * * 1-5"   # 14:30
    - cron: "35 6 * * 1-5"   # 15:35
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update data
        run: python update_data.py

      - name: Commit data
        run: |
          git config user.name "daily-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update board data"
          git push
