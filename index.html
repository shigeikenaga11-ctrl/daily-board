<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Daily Board</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background:
        radial-gradient(
            circle at top,
            #172333,
            #070c13 65%
        );
    color: #f5f7fa;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
    overflow: hidden;
}

body {
    display: flex;
    flex-direction: column;
}

header {
    height: 72px;
    padding: 0 34px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom:
        1px solid
        rgba(255,255,255,0.08);
    background:
        rgba(5,10,17,0.70);
}

.brand {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.12em;
}

.header-right {
    display: flex;
    gap: 26px;
    align-items: center;
    color: #aab6c7;
    font-size: 15px;
}

#screen {
    position: relative;
    flex: 1;
}

.page {
    position: absolute;
    inset: 0;
    padding: 34px 46px;
    opacity: 0;
    transition:
        opacity 2s ease;
    pointer-events: none;
}

.page.active {
    opacity: 1;
    pointer-events: auto;
}

.eyebrow {
    color: #8392a7;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.18em;
    margin-bottom: 12px;
}

.page-title {
    margin: 0;
    font-size: 46px;
    line-height: 1.08;
}

.subtle {
    color: #8997aa;
}

/* WEATHER */

.weather-wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.weather-main {
    display: flex;
    align-items: flex-end;
    gap: 35px;
    margin-top: 20px;
}

.weather-text {
    font-size: 72px;
    font-weight: 800;
}

.weather-temp {
    font-size: 32px;
    color: #c6d0dd;
    padding-bottom: 10px;
}

.weather-rain {
    margin-top: 24px;
    font-size: 22px;
    color: #9caabd;
}

/* ASSET SUMMARY */

.asset-page {
    padding-top: 25px;
}

.asset-top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 30px;
    margin-bottom: 25px;
}

.asset-total-label {
    color: #a4afbd;
    font-size: 16px;
    margin-bottom: 6px;
}

.asset-total {
    font-size: 49px;
    font-weight: 800;
    letter-spacing: -0.03em;
}

.asset-purchase-total {
    margin-top: 5px;
    color: #8794a6;
    font-size: 15px;
    font-weight: 600;
}

.asset-total-change {
    text-align: right;
    font-size: 25px;
    font-weight: 800;
    padding-bottom: 6px;
}

.asset-table {
    width: 100%;
    border:
        1px solid
        rgba(255,255,255,0.09);
    border-radius: 18px;
    overflow: hidden;
    background:
        rgba(10,17,27,0.72);
    box-shadow:
        0 18px 60px
        rgba(0,0,0,0.25);
}

.asset-head,
.asset-row {
    display: grid;
    grid-template-columns:
        2fr
        1.15fr
        1.15fr
        1.5fr;
    align-items: center;
}

.asset-head {
    min-height: 52px;
    padding: 0 25px;
    background:
        rgba(255,255,255,0.045);
    color: #8f9db0;
    font-size: 14px;
    font-weight: 700;
}

.asset-row {
    min-height: 88px;
    padding: 10px 25px;
    border-top:
        1px solid
        rgba(255,255,255,0.07);
}

.asset-name {
    font-size: 21px;
    font-weight: 750;
}

.asset-qty {
    margin-top: 5px;
    color: #8794a6;
    font-size: 14px;
    font-weight: 500;
}

.asset-price {
    font-size: 22px;
    font-weight: 750;
}

.asset-cost {
    margin-top: 5px;
    color: #8390a2;
    font-size: 13px;
    font-weight: 600;
}

.asset-day-change {
    font-size: 21px;
    font-weight: 800;
}

.asset-value {
    font-size: 23px;
    font-weight: 800;
}

.asset-delta {
    margin-top: 5px;
    color: #8794a6;
    font-size: 13px;
    font-weight: 650;
}

.positive {
    color: #38d996;
}

.negative {
    color: #ff6873;
}

.neutral {
    color: #9ba7b7;
}

/* MARKET PAGES */

.market-page {
    display: flex;
    flex-direction: column;
}

.market-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
}

.market-name {
    font-size: 42px;
    font-weight: 800;
}

.market-price {
    margin-top: 8px;
    font-size: 25px;
    color: #c8d1dd;
}

.market-change {
    font-size: 28px;
    font-weight: 800;
}

.chart-card {
    flex: 1;
    min-height: 0;
    margin-top: 24px;
    border:
        1px solid
        rgba(255,255,255,0.08);
    border-radius: 20px;
    background:
        rgba(9,15,24,0.75);
    padding: 20px;
}

.chart-card svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

/* NEWS */

.news-page {
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.news-card {
    width: 100%;
    max-width: 1100px;
    padding: 38px 42px;
    border:
        1px solid
        rgba(255,255,255,0.09);
    border-radius: 22px;
    background:
        rgba(9,16,26,0.78);
}

.news-date {
    color: #8493a6;
    font-size: 14px;
    margin-bottom: 15px;
}

.news-title {
    font-size: 36px;
    line-height: 1.3;
    font-weight: 800;
}

.news-description {
    margin-top: 22px;
    color: #c0cad7;
    font-size: 20px;
    line-height: 1.75;
}

.news-source {
    margin-top: 24px;
    color: #7f8da0;
    font-size: 14px;
}

.news-link {
    color: inherit;
    text-decoration: none;
}

.footer-note {
    position: absolute;
    right: 28px;
    bottom: 17px;
    color: #5f6c7c;
    font-size: 12px;
}

</style>

</head>

<body>

<header>

<div class="brand">
    DAILY BOARD
</div>

<div class="header-right">

<div id="updated">
    —
</div>

<div id="clock">
    —
</div>

</div>

</header>

<div id="screen"></div>

<script>

const screen =
    document.getElementById("screen");

let pages = [];
let pageIndex = 0;
let pageTimer = null;

function yen(value) {

    if (
        value === null ||
        value === undefined ||
        Number.isNaN(Number(value))
    ) {
        return "—";
    }

    return "¥" +
        Math.round(Number(value))
        .toLocaleString("ja-JP");
}

function priceYen(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "—";
    }

    const n = Number(value);

    const decimals =
        Number.isInteger(n)
        ? 0
        : 1;

    return "¥" +
        n.toLocaleString(
            "ja-JP",
            {
                minimumFractionDigits:
                    decimals,
                maximumFractionDigits: 2
            }
        );
}

function signedYen(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "—";
    }

    const n =
        Math.round(Number(value));

    if (n > 0) {
        return "+¥" +
            n.toLocaleString("ja-JP");
    }

    if (n < 0) {
        return "−¥" +
            Math.abs(n)
            .toLocaleString("ja-JP");
    }

    return "±¥0";
}

function percent(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "—";
    }

    const n = Number(value);

    if (n > 0) {
        return "+" +
            n.toFixed(2) +
            "%";
    }

    if (n < 0) {
        return "−" +
            Math.abs(n)
            .toFixed(2) +
            "%";
    }

    return "0.00%";
}

function directionClass(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "neutral";
    }

    if (Number(value) > 0) {
        return "positive";
    }

    if (Number(value) < 0) {
        return "negative";
    }

    return "neutral";
}

function arrow(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    if (Number(value) > 0) {
        return "▲";
    }

    if (Number(value) < 0) {
        return "▼";
    }

    return "•";
}

function addPage(html) {

    const div =
        document.createElement("section");

    div.className = "page";
    div.innerHTML = html;

    screen.appendChild(div);

    pages.push(div);
}

function weatherPage(data) {

    const w = data.weather || {};

    addPage(`
        <div class="weather-wrap">

            <div class="eyebrow">
                SAPPORO WEATHER
            </div>

            <h1 class="page-title">
                今日の札幌
            </h1>

            <div class="weather-main">

                <div class="weather-text">
                    ${w.text ?? "—"}
                </div>

                <div class="weather-temp">
                    最高
                    ${w.max ?? "—"}℃
                    &nbsp;&nbsp;
                    最低
                    ${w.min ?? "—"}℃
                </div>

            </div>

            <div class="weather-rain">
                降水確率
                ${w.rain ?? "—"}%
            </div>

        </div>
    `);
}

function assetSummaryPage(data) {

    const summary =
        data.summary || {};

    const assets =
        (data.assets || [])
        .filter(
            a =>
            a.ticker !== "eMAXIS"
        );

    const totalClass =
        directionClass(
            summary.deltaYen
        );

    const rows =
        assets.map(a => {

            const cls =
                directionClass(
                    a.change
                );

            return `
                <div class="asset-row">

                    <div>

                        <div class="asset-name">
                            ${a.name}
                        </div>

                        <div class="asset-qty">
                            ${a.qtyLabel}
                        </div>

                    </div>

                    <div>

                        <div class="asset-price">
                            ${priceYen(a.price)}
                        </div>

                        <div class="asset-cost">
                            取得
                            ${priceYen(a.cost)}
                        </div>

                    </div>

                    <div
                        class="asset-day-change ${cls}"
                    >
                        ${arrow(a.change)}
                        ${percent(a.change)}
                    </div>

                    <div>

                        <div class="asset-value">
                            ${yen(a.value)}
                        </div>

                        <div class="asset-delta">
                            Δ
                            ${signedYen(
                                a.deltaYen
                            )}
                        </div>

                    </div>

                </div>
            `;
        })
        .join("");

    addPage(`
        <div class="asset-page">

            <div class="eyebrow">
                MY ASSETS
            </div>

            <div class="asset-top">

                <div>

                    <div
                        class="asset-total-label"
                    >
                        日本株評価額
                    </div>

                    <div class="asset-total">
                        ${yen(summary.total)}
                    </div>

                    <div
                        class="asset-purchase-total"
                    >
                        総取得額
                        ${yen(
                            summary.purchaseTotal
                        )}
                    </div>

                </div>

                <div
                    class="
                        asset-total-change
                        ${totalClass}
                    "
                >
                    ${arrow(
                        summary.deltaYen
                    )}
                    ${signedYen(
                        summary.deltaYen
                    )}
                    &nbsp;
                    ${percent(
                        summary.deltaPercent
                    )}
                </div>

            </div>

            <div class="asset-table">

                <div class="asset-head">

                    <div>銘柄</div>
                    <div>株単価</div>
                    <div>前日比</div>
                    <div>評価額</div>

                </div>

                ${rows}

            </div>

        </div>
    `);
}

function chartHTML(points) {

    if (
        !points ||
        points.length < 2
    ) {
        return `
            <div
                style="
                    height:100%;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    color:#7e8a99;
                "
            >
                データ取得待ち
            </div>
        `;
    }

    const width = 1000;
    const height = 430;

    const left = 82;
    const right = 28;
    const top = 22;
    const bottom = 48;

    const values =
        points.map(
            p => Number(p.value)
        );

    let min =
        Math.min(...values);

    let max =
        Math.max(...values);

    if (min === max) {
        min -= 1;
        max += 1;
    }

    const range =
        max - min;

    min -= range * 0.08;
    max += range * 0.08;

    const plotWidth =
        width - left - right;

    const plotHeight =
        height - top - bottom;

    const x = i =>
        left +
        (
            i /
            (points.length - 1)
        ) *
        plotWidth;

    const y = value =>
        top +
        (
            (max - value) /
            (max - min)
        ) *
        plotHeight;

    const polyline =
        points.map(
            (p, i) =>
                `${x(i)},${y(p.value)}`
        ).join(" ");

    let grid = "";

    for (
        let i = 0;
        i < 5;
        i++
    ) {

        const ratio =
            i / 4;

        const gy =
            top +
            ratio *
            plotHeight;

        const value =
            max -
            ratio *
            (max - min);

        grid += `
            <line
                x1="${left}"
                y1="${gy}"
                x2="${width-right}"
                y2="${gy}"
                stroke="rgba(255,255,255,0.08)"
                stroke-width="1"
            />

            <text
                x="${left-12}"
                y="${gy+5}"
                text-anchor="end"
                fill="#748195"
                font-size="13"
            >
                ¥${Math.round(value).toLocaleString("ja-JP")}
            </text>
        `;
    }

    const labelIndexes =
        [
            0,
            Math.floor(
                (points.length - 1) / 2
            ),
            points.length - 1
        ];

    let xLabels = "";

    labelIndexes.forEach(i => {

        const p =
            points[i];

        xLabels += `
            <text
                x="${x(i)}"
                y="${height-13}"
                text-anchor="middle"
                fill="#748195"
                font-size="13"
            >
                ${p.label}
            </text>
        `;
    });

    return `
        <svg
            viewBox="
                0 0
                ${width}
                ${height}
            "
            preserveAspectRatio="none"
        >

            ${grid}

            <polyline
                points="${polyline}"
                fill="none"
                stroke="#d8e1ec"
                stroke-width="4"
                stroke-linecap="round"
                stroke-linejoin="round"
            />

            ${xLabels}

        </svg>
    `;
}

function marketPage(
    asset,
    periodLabel,
    points,
    change
) {

    if (
        !points ||
        points.length < 2
    ) {
        return;
    }

    const cls =
        directionClass(change);

    addPage(`
        <div class="market-page">

            <div class="eyebrow">
                ${periodLabel}
            </div>

            <div class="market-top">

                <div>

                    <div class="market-name">
                        ${asset.name}
                    </div>

                    <div class="market-price">
                        ${priceYen(asset.price)}
                        ・
                        ${asset.qtyLabel}
                    </div>

                </div>

                <div
                    class="market-change ${cls}"
                >
                    ${arrow(change)}
                    ${percent(change)}
                </div>

            </div>

            <div class="chart-card">
                ${chartHTML(points)}
            </div>

        </div>
    `);
}

function newsPage(asset) {

    if (
        !asset.news ||
        asset.news.length === 0
    ) {
        return;
    }

    const n =
        asset.news[0];

    addPage(`
        <div class="news-page">

            <div class="eyebrow">
                ${asset.name} NEWS
            </div>

            <div class="news-card">

                <div class="news-date">
                    ${n.date || ""}
                </div>

                <div class="news-title">
                    ${n.title || ""}
                </div>

                <div class="news-description">
                    ${n.description || ""}
                </div>

                <div class="news-source">

                    ${
                        n.link
                        ?
                        `
                        <a
                            class="news-link"
                            href="${n.link}"
                            target="_blank"
                        >
                            ${n.source || "記事を開く"}
                        </a>
                        `
                        :
                        (n.source || "")
                    }

                </div>

            </div>

        </div>
    `);
}

function buildPages(data) {

    screen.innerHTML = "";
    pages = [];

    weatherPage(data);

    assetSummaryPage(data);

    (data.assets || [])
    .forEach(asset => {

        if (
            asset.intraday &&
            asset.intraday.length >= 2
        ) {
            marketPage(
                asset,
                "1 DAY",
                asset.intraday,
                asset.change
            );
        }

        if (
            asset.week &&
            asset.week.length >= 2
        ) {
            marketPage(
                asset,
                "1 WEEK",
                asset.week,
                asset.weekChange
            );
        }

        if (
            asset.month &&
            asset.month.length >= 2
        ) {
            marketPage(
                asset,
                "1 MONTH",
                asset.month,
                asset.monthChange
            );
        }

        newsPage(asset);
    });

    if (pages.length) {
        pages[0]
        .classList.add("active");
    }

    pageIndex = 0;

    if (pageTimer) {
        clearInterval(pageTimer);
    }

    pageTimer =
        setInterval(
            nextPage,
            20000
        );
}

function nextPage() {

    if (
        pages.length <= 1
    ) {
        return;
    }

    pages[pageIndex]
    .classList.remove("active");

    pageIndex =
        (
            pageIndex + 1
        ) % pages.length;

    pages[pageIndex]
    .classList.add("active");
}

async function loadData() {

    try {

        const response =
            await fetch(
                "data.json?t=" +
                Date.now()
            );

        const data =
            await response.json();

        document
        .getElementById("updated")
        .textContent =
            "更新 " +
            data.updated_at;

        buildPages(data);

    }

    catch (error) {

        console.error(
            "data.json load error:",
            error
        );
    }
}

function updateClock() {

    const now =
        new Date();

    const text =
        now.toLocaleString(
            "ja-JP",
            {
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    document
    .getElementById("clock")
    .textContent =
        text;
}

updateClock();

setInterval(
    updateClock,
    1000
);

loadData();

setInterval(
    loadData,
    15 * 60 * 1000
);

</script>

</body>

</html>
