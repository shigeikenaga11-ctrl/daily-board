<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Daily Board</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #f4f7fb;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Sans",
        "Yu Gothic",
        Meiryo,
        sans-serif;
    }

    #app {
      position: absolute;
      inset: 0;

      padding-top: env(safe-area-inset-top);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);

      background: #000;
    }

    #board {
      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;

      background:
        radial-gradient(circle at top, #172333, #070c13 65%);
    }

    header {
      height: 72px;
      min-height: 72px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 34px;

      background: rgba(5, 10, 17, 0.72);
      border: none;
    }

    .header-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .header-time {
      font-size: 17px;
      color: #aeb8c7;
    }

    main {
      flex: 1;
      min-height: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px 42px 38px;
    }

    #page {
      width: 100%;
      height: 100%;

      opacity: 1;
      transition: opacity 2s ease;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    #page.fade {
      opacity: 0;
    }

    .screen {
      width: 100%;
      max-width: 1180px;
      height: 100%;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .eyebrow {
      margin-bottom: 12px;

      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.13em;
      color: #7f92aa;
    }

    .title {
      margin: 0 0 24px;

      font-size: clamp(30px, 4vw, 52px);
      line-height: 1.15;
      font-weight: 750;
    }

    .subtitle {
      margin-top: -10px;
      margin-bottom: 24px;

      font-size: 18px;
      color: #95a3b6;
    }

    .big-value {
      font-size: clamp(58px, 8vw, 102px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .medium-value {
      font-size: clamp(38px, 5vw, 64px);
      font-weight: 750;
      letter-spacing: -0.03em;
    }

    .positive {
      color: #3ee786;
    }

    .negative {
      color: #ff5f68;
    }

    .neutral {
      color: #d9e0ea;
    }

    .muted {
      color: #8f9cad;
    }

    .change-main {
      margin-top: 20px;

      font-size: clamp(28px, 4vw, 48px);
      font-weight: 800;
    }

    .grid {
      display: grid;
      gap: 18px;
    }

    .grid-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .card {
      min-width: 0;

      padding: 24px 26px;

      border: 1px solid rgba(127, 155, 188, 0.28);
      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          rgba(23, 39, 57, 0.88),
          rgba(10, 18, 28, 0.86)
        );

      box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.22);
    }

    .card-label {
      margin-bottom: 10px;

      font-size: 17px;
      color: #8e9caf;
    }

    .card-value {
      font-size: clamp(27px, 3vw, 42px);
      font-weight: 750;
      line-height: 1.15;
    }

    .card-sub {
      margin-top: 8px;

      font-size: 16px;
      color: #8e9caf;
    }

    .summary-box {
      margin-top: 32px;

      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 18px 0;

      border-bottom: 1px solid rgba(142, 162, 187, 0.2);

      font-size: 21px;
    }

    .summary-row:last-child {
      border-bottom: none;
    }

    .summary-label {
      color: #a6b1bf;
    }

    .summary-value {
      font-weight: 700;
      text-align: right;
    }

    .stock-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .stock-card {
      padding: 24px;

      border-radius: 20px;
      border: 1px solid rgba(127, 155, 188, 0.28);

      background:
        linear-gradient(
          145deg,
          rgba(23, 39, 57, 0.88),
          rgba(10, 18, 28, 0.86)
        );
    }

    .stock-name {
      margin-bottom: 15px;

      font-size: 21px;
      font-weight: 700;
    }

    .stock-price {
      font-size: 36px;
      font-weight: 800;
    }

    .stock-change {
      margin-top: 8px;

      font-size: 22px;
      font-weight: 700;
    }

    .stock-value {
      margin-top: 15px;

      font-size: 16px;
      color: #9aa7b8;
    }

    .fund-hero {
      padding: 32px;

      border-radius: 24px;
      border: 1px solid rgba(76, 141, 215, 0.38);

      background:
        linear-gradient(
          145deg,
          rgba(19, 39, 60, 0.94),
          rgba(8, 17, 27, 0.92)
        );
    }

    .fund-name {
      margin-bottom: 18px;

      font-size: 24px;
      font-weight: 700;
      color: #dfe8f3;
    }

    .fund-value {
      font-size: clamp(55px, 7vw, 92px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .fund-daily {
      margin-top: 20px;
      margin-bottom: 26px;

      font-size: clamp(28px, 4vw, 47px);
      font-weight: 800;
    }

    .fund-info {
      border-top: 1px solid rgba(144, 164, 188, 0.25);
    }

    .fund-row {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 15px 2px;

      border-bottom: 1px solid rgba(144, 164, 188, 0.18);

      font-size: 20px;
    }

    .fund-row:last-child {
      border-bottom: none;
    }

    .fund-row-label {
      color: #a8b4c4;
    }

    .fund-row-value {
      font-weight: 700;
      text-align: right;
    }

    .chart-wrap {
      width: 100%;
      height: 66vh;
      min-height: 360px;

      padding: 20px 16px 8px;

      border-radius: 22px;
      border: 1px solid rgba(127, 155, 188, 0.24);

      background: rgba(7, 14, 22, 0.58);
    }

    .chart-wrap svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .news-card {
      max-width: 980px;

      padding: 38px;

      border-radius: 24px;
      border: 1px solid rgba(127, 155, 188, 0.28);

      background:
        linear-gradient(
          145deg,
          rgba(23, 39, 57, 0.9),
          rgba(10, 18, 28, 0.9)
        );
    }

    .news-source {
      margin-bottom: 14px;

      font-size: 18px;
      font-weight: 700;
      color: #65a9ff;
    }

    .news-title {
      margin-bottom: 22px;

      font-size: clamp(28px, 4vw, 48px);
      line-height: 1.3;
      font-weight: 750;
    }

    .news-description {
      font-size: 20px;
      line-height: 1.7;
      color: #bdc7d4;
    }

    .error {
      font-size: 24px;
      color: #ff7279;
    }

    @media (max-width: 850px) {
      header {
        padding: 0 20px;
      }

      main {
        padding: 22px 20px 28px;
      }

      .grid-4,
      .stock-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="board">

      <header>
        <div class="header-title">DAILY BOARD</div>
        <div id="updated" class="header-time">Loading...</div>
      </header>

      <main>
        <div id="page"></div>
      </main>

    </div>
  </div>

  <script>
    const PAGE_INTERVAL = 20000;
    const FADE_TIME = 2000;

    let pages = [];
    let pageIndex = 0;
    let rotationTimer = null;

    const page = document.getElementById("page");
    const updated = document.getElementById("updated");


    function yen(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) {
        return "—";
      }

      return Math.round(Number(value)).toLocaleString("ja-JP") + "円";
    }


    function priceYen(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) {
        return "—";
      }

      return Number(value).toLocaleString("ja-JP", {
        maximumFractionDigits: 2
      }) + "円";
    }


    function signedYen(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) {
        return "—";
      }

      const n = Math.round(Number(value));

      if (n > 0) {
        return "+" + n.toLocaleString("ja-JP") + "円";
      }

      if (n < 0) {
        return n.toLocaleString("ja-JP") + "円";
      }

      return "±0円";
    }


    function percent(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) {
        return "—";
      }

      const n = Number(value);
      const sign = n > 0 ? "+" : "";

      return sign + n.toFixed(2) + "%";
    }


    function directionClass(value) {
      const n = Number(value);

      if (n > 0) return "positive";
      if (n < 0) return "negative";

      return "neutral";
    }


    function arrow(value) {
      const n = Number(value);

      if (n > 0) return "▲";
      if (n < 0) return "▼";

      return "―";
    }


    function weatherPage(data) {
      const w = data.weather || {};

      return `
        <div class="screen">

          <div class="eyebrow">SAPPORO</div>

          <h1 class="title">札幌の天気</h1>

          <div class="grid grid-2">

            <div class="card">
              <div class="card-label">現在</div>

              <div class="big-value">
                ${w.temperature !== undefined ? Math.round(w.temperature) + "°C" : "—"}
              </div>

              <div class="card-sub">
                ${w.weather || w.description || ""}
              </div>
            </div>

            <div class="card">
              <div class="card-label">今日</div>

              <div class="card-value">
                ${w.min !== undefined ? Math.round(w.min) + "°" : "—"}
                /
                ${w.max !== undefined ? Math.round(w.max) + "°" : "—"}
              </div>

              <div class="card-sub">
                降水確率
                ${w.precipitation !== undefined ? Math.round(w.precipitation) + "%" : "—"}
              </div>
            </div>

          </div>

        </div>
      `;
    }


    function totalPage(data) {
      const t = data.totalSummary || {};
      const stock = data.summary || {};

      const fund = (data.assets || []).find(
        x => x.type === "fund" || x.code === "03311187"
      );

      const purchase = Number(t.purchase || 0);
      const total = Number(t.total || 0);

      const unrealized =
        t.unrealized !== undefined && t.unrealized !== null
          ? Number(t.unrealized)
          : total - purchase;

      const unrealizedPct =
        purchase > 0
          ? (unrealized / purchase) * 100
          : null;

      return `
        <div class="screen">

          <div class="eyebrow">TOTAL ASSETS</div>

          <h1 class="title">総資産評価額</h1>

          <div class="big-value">
            ${yen(t.total)}
          </div>

          <div class="change-main ${directionClass(t.deltaYen)}">
            ${arrow(t.deltaYen)}
            ${signedYen(t.deltaYen)}
            （${percent(t.change)}）
          </div>

          <div class="summary-box">

            <div class="card">
              <div class="card-label">総取得額</div>

              <div class="card-value">
                ${yen(t.purchase)}
              </div>
            </div>

            <div class="card">
              <div class="card-label">評価損益</div>

              <div class="card-value ${directionClass(unrealized)}">
                ${signedYen(unrealized)}
              </div>

              <div class="card-sub">
                ${percent(unrealizedPct)}
              </div>
            </div>

            <div class="card">
              <div class="card-label">日本株</div>

              <div class="card-value">
                ${yen(stock.total)}
              </div>

              <div class="card-sub ${directionClass(stock.deltaYen)}">
                前日比 ${signedYen(stock.deltaYen)}
              </div>
            </div>

            <div class="card">
              <div class="card-label">投資信託</div>

              <div class="card-value">
                ${fund ? yen(fund.value) : "—"}
              </div>

              <div class="card-sub ${fund ? directionClass(fund.deltaYen) : "neutral"}">
                前日比 ${fund ? signedYen(fund.deltaYen) : "—"}
              </div>
            </div>

          </div>

        </div>
      `;
    }


    function stockSummaryPage(data) {
      const stocks = (data.assets || []).filter(
        x => x.type !== "fund" && x.code !== "03311187"
      );

      return `
        <div class="screen">

          <div class="eyebrow">JAPANESE STOCKS</div>

          <h1 class="title">日本株</h1>

          <div class="stock-grid">

            ${stocks.map(stock => `
              <div class="stock-card">

                <div class="stock-name">
                  ${stock.name || stock.code}
                </div>

                <div class="stock-price">
                  ${priceYen(stock.price)}
                </div>

                <div class="stock-change ${directionClass(stock.change)}">
                  ${arrow(stock.change)}
                  ${signedYen(stock.delta)}
                  （${percent(stock.change)}）
                </div>

                <div class="stock-value">
                  ${stock.qty ? stock.qty.toLocaleString("ja-JP") + "株" : ""}
                  ${stock.value !== undefined ? "　評価額 " + yen(stock.value) : ""}
                </div>

              </div>
            `).join("")}

          </div>

        </div>
      `;
    }


    /*
      投資信託ページ

      ★今回の変更箇所

      メインの緑/赤表示を
      「購入時からの評価損益」ではなく
      「前日からの評価額増減」に変更。

      評価損益は下部に白文字で残す。
    */
    function fundSummaryPage(fund) {
      const purchase = Number(fund.purchase || 0);
      const value = Number(fund.value || 0);

      const unrealized =
        fund.unrealized !== undefined && fund.unrealized !== null
          ? Number(fund.unrealized)
          : value - purchase;

      const unrealizedPct =
        purchase > 0
          ? (unrealized / purchase) * 100
          : null;

      return `
        <div class="screen">

          <div class="eyebrow">INVESTMENT FUND</div>

          <div class="fund-hero">

            <div class="fund-name">
              ${fund.name || "eMAXIS Slim 米国株式（S&P500）"}
            </div>

            <div class="fund-value">
              ${yen(fund.value)}
            </div>


            <!--
              ここを前日からの増減額に統一
            -->
            <div class="fund-daily ${directionClass(fund.deltaYen)}">
              ${arrow(fund.deltaYen)}
              前日から
              ${signedYen(fund.deltaYen)}
              （${percent(fund.change)}）
            </div>


            <div class="fund-info">

              <div class="fund-row">
                <div class="fund-row-label">
                  基準価額
                </div>

                <div class="fund-row-value">
                  ${priceYen(fund.price)}
                </div>
              </div>


              <div class="fund-row">
                <div class="fund-row-label">
                  前日比
                </div>

                <div class="fund-row-value ${directionClass(fund.change)}">
                  ${percent(fund.change)}
                </div>
              </div>


              <div class="fund-row">
                <div class="fund-row-label">
                  保有口数
                </div>

                <div class="fund-row-value">
                  ${fund.qty !== undefined
                    ? Number(fund.qty).toLocaleString("ja-JP") + "口"
                    : "—"}
                </div>
              </div>


              <div class="fund-row">
                <div class="fund-row-label">
                  取得単価
                </div>

                <div class="fund-row-value">
                  ${priceYen(fund.cost)}
                </div>
              </div>


              <!--
                購入時からの損益は補助情報。
                緑/赤にはしない。
              -->
              <div class="fund-row">
                <div class="fund-row-label">
                  評価損益
                </div>

                <div class="fund-row-value neutral">
                  ${signedYen(unrealized)}
                  （${percent(unrealizedPct)}）
                </div>
              </div>

            </div>

          </div>

        </div>
      `;
    }


    function chartPage(asset, points, periodTitle) {
      if (!points || points.length < 2) {
        return "";
      }

      const values = points
        .map(p => Number(p.price ?? p.value ?? p.close))
        .filter(v => Number.isFinite(v));

      if (values.length < 2) {
        return "";
      }

      const width = 1000;
      const height = 500;

      const padLeft = 105;
      const padRight = 35;
      const padTop = 35;
      const padBottom = 70;

      let min = Math.min(...values);
      let max = Math.max(...values);

      if (max === min) {
        max += 1;
        min -= 1;
      }

      const range = max - min;

      min -= range * 0.08;
      max += range * 0.08;

      const plotWidth = width - padLeft - padRight;
      const plotHeight = height - padTop - padBottom;

      const x = i =>
        padLeft +
        (i / Math.max(values.length - 1, 1)) * plotWidth;

      const y = v =>
        padTop +
        ((max - v) / (max - min)) * plotHeight;

      const polyline = values
        .map((v, i) => `${x(i)},${y(v)}`)
        .join(" ");

      const yTicks = 5;

      let yGrid = "";

      for (let i = 0; i < yTicks; i++) {
        const ratio = i / (yTicks - 1);
        const val = max - ratio * (max - min);
        const yy = padTop + ratio * plotHeight;

        yGrid += `
          <line
            x1="${padLeft}"
            y1="${yy}"
            x2="${width - padRight}"
            y2="${yy}"
            stroke="rgba(151,170,194,.16)"
            stroke-width="1"
          />

          <text
            x="${padLeft - 16}"
            y="${yy + 6}"
            text-anchor="end"
            fill="#8291a4"
            font-size="17"
          >
            ${Math.round(val).toLocaleString("ja-JP")}
          </text>
        `;
      }

      const labelIndexes = [
        0,
        Math.floor((points.length - 1) / 2),
        points.length - 1
      ];

      let xLabels = "";

      [...new Set(labelIndexes)].forEach(i => {
        const p = points[i];

        const label =
          p.label ||
          p.time ||
          p.date ||
          "";

        xLabels += `
          <text
            x="${x(i)}"
            y="${height - 24}"
            text-anchor="middle"
            fill="#8291a4"
            font-size="16"
          >
            ${label}
          </text>
        `;
      });

      const first = values[0];
      const last = values[values.length - 1];

      const delta = last - first;
      const deltaPct = first !== 0 ? (delta / first) * 100 : 0;

      return `
        <div class="screen">

          <div class="eyebrow">${periodTitle}</div>

          <h1 class="title">
            ${asset.name || asset.code}
          </h1>

          <div class="subtitle ${directionClass(delta)}">
            ${arrow(delta)}
            ${delta > 0 ? "+" : ""}
            ${delta.toLocaleString("ja-JP", {
              maximumFractionDigits: 2
            })}
            円
            （${percent(deltaPct)}）
          </div>

          <div class="chart-wrap">

            <svg
              viewBox="0 0 ${width} ${height}"
              preserveAspectRatio="none"
            >

              ${yGrid}

              <polyline
                points="${polyline}"
                fill="none"
                stroke="#64a9ff"
                stroke-width="5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />

              ${values.map((v, i) => `
                <circle
                  cx="${x(i)}"
                  cy="${y(v)}"
                  r="${i === values.length - 1 ? 7 : 3}"
                  fill="${i === values.length - 1 ? "#f4f7fb" : "#64a9ff"}"
                />
              `).join("")}

              ${xLabels}

            </svg>

          </div>

        </div>
      `;
    }


    function newsPage(asset) {
      const news = asset.news;

      if (!news) {
        return "";
      }

      const title =
        news.title ||
        news.headline ||
        "";

      const description =
        news.description ||
        news.summary ||
        "";

      const source =
        news.source ||
        news.publisher ||
        "NEWS";

      if (!title && !description) {
        return "";
      }

      return `
        <div class="screen">

          <div class="eyebrow">
            ${asset.name || asset.code} / NEWS
          </div>

          <div class="news-card">

            <div class="news-source">
              ${source}
            </div>

            <div class="news-title">
              ${title}
            </div>

            <div class="news-description">
              ${description}
            </div>

          </div>

        </div>
      `;
    }


    function buildPages(data) {
      const result = [];

      /*
        1. 天気
      */
      result.push(
        weatherPage(data)
      );


      /*
        2. 総資産
        ここは今回変更なし
      */
      result.push(
        totalPage(data)
      );


      /*
        3. 日本株一覧
      */
      result.push(
        stockSummaryPage(data)
      );


      const assets = data.assets || [];

      const fund = assets.find(
        x => x.type === "fund" || x.code === "03311187"
      );


      /*
        4. 投資信託一覧
      */
      if (fund) {
        result.push(
          fundSummaryPage(fund)
        );
      }


      /*
        個別資産ページ
      */
      assets.forEach(asset => {

        const isFund =
          asset.type === "fund" ||
          asset.code === "03311187";


        /*
          日本株のみ1日チャート
        */
        if (
          !isFund &&
          asset.intraday &&
          asset.intraday.length >= 2
        ) {
          const p = chartPage(
            asset,
            asset.intraday,
            "1 DAY"
          );

          if (p) result.push(p);
        }


        /*
          1週間
        */
        if (
          asset.week &&
          asset.week.length >= 2
        ) {
          const p = chartPage(
            asset,
            asset.week,
            "1 WEEK"
          );

          if (p) result.push(p);
        }


        /*
          1か月
        */
        if (
          asset.month &&
          asset.month.length >= 2
        ) {
          const p = chartPage(
            asset,
            asset.month,
            "1 MONTH"
          );

          if (p) result.push(p);
        }


        /*
          ニュース
        */
        const n = newsPage(asset);

        if (n) {
          result.push(n);
        }

      });


      pages = result.filter(Boolean);
      pageIndex = 0;
    }


    function renderPage(index) {
      if (!pages.length) {
        page.innerHTML = `
          <div class="error">
            表示できるデータがありません
          </div>
        `;

        return;
      }

      page.innerHTML =
        pages[index % pages.length];
    }


    function startRotation() {
      if (rotationTimer) {
        clearInterval(rotationTimer);
      }

      renderPage(pageIndex);

      rotationTimer = setInterval(() => {

        page.classList.add("fade");

        setTimeout(() => {

          pageIndex =
            (pageIndex + 1) % pages.length;

          renderPage(pageIndex);

          requestAnimationFrame(() => {
            page.classList.remove("fade");
          });

        }, FADE_TIME);

      }, PAGE_INTERVAL);
    }


    async function loadData() {
      try {
        const response = await fetch(
          `data.json?t=${Date.now()}`,
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(
            "HTTP " + response.status
          );
        }

        const data =
          await response.json();

        updated.textContent =
          data.updated
            ? "更新 " + data.updated
            : "更新済み";

        buildPages(data);
        startRotation();

      } catch (error) {

        console.error(error);

        updated.textContent =
          "データ取得エラー";

        page.innerHTML = `
          <div class="error">
            data.json を読み込めませんでした
          </div>
        `;
      }
    }


    /*
      初回読み込み
    */
    loadData();


    /*
      data.jsonは15分ごとに再取得
    */
    setInterval(
      loadData,
      15 * 60 * 1000
    );

  </script>
</body>
</html>
