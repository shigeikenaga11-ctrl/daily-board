<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Daily Board</title>
<style>
:root {
  --bg:#090c11;
  --panel:#141922;
  --text:#f6f8fb;
  --muted:#9aa6b2;
  --line:#2a313c;
  --up:#62dba4;
  --down:#ff8585;
}
* {box-sizing:border-box}
html,body {
  margin:0;width:100%;height:100%;overflow:hidden;
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,
  "Helvetica Neue","Noto Sans JP",sans-serif;
}
body {padding:16px 20px}
.board {
  height:100%;max-width:1180px;margin:auto;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  gap:12px;
}
header {
  display:flex;justify-content:space-between;
  align-items:end;gap:12px;
}
.date {font-size:clamp(21px,3vw,38px);font-weight:750}
.clock {font-size:clamp(36px,6vw,72px);font-weight:850}
.stage {position:relative;min-height:0}
.page {
  position:absolute;inset:0;opacity:0;
  transform:scale(.975);
  transition:opacity 2s ease,transform 2s ease;
  pointer-events:none;
}
.page.active {opacity:1;transform:scale(1);pointer-events:auto}
.card {
  height:100%;background:var(--panel);
  border:1px solid var(--line);border-radius:25px;
  padding:clamp(17px,3vw,38px);
  display:flex;flex-direction:column;justify-content:center;
  overflow:hidden;
}
.eyebrow {
  font-size:clamp(13px,1.6vw,21px);
  color:#dce6f2;font-weight:750;margin-bottom:13px;
}
.big {font-size:clamp(40px,7vw,85px);font-weight:850}
.temp {font-size:clamp(25px,4vw,50px);font-weight:750;margin-top:18px}
.sub {
  font-size:clamp(13px,1.65vw,20px);
  color:var(--muted);margin-top:10px;
}
.name {
  font-size:clamp(25px,4vw,50px);
  font-weight:850;line-height:1.18;
}
.qty {font-size:clamp(13px,1.6vw,21px);color:var(--muted)}
.assethead {
  display:flex;align-items:end;
  justify-content:space-between;gap:14px;
}
.metrics {
  display:flex;align-items:baseline;
  flex-wrap:wrap;gap:12px 24px;margin:10px 0;
}
.price {font-size:clamp(27px,4vw,51px);font-weight:800}
.change {font-size:clamp(18px,2.4vw,29px);font-weight:750}
.up {color:var(--up)}
.down {color:var(--down)}
.flat {color:var(--muted)}

/* 資産一覧 */
.summary-top {
  border-bottom:1px solid var(--line);
  padding-bottom:14px;margin-bottom:10px;
}
.summary-label {
  font-size:clamp(13px,1.6vw,20px);
  color:var(--muted);
}
.summary-total {
  font-size:clamp(33px,5.2vw,66px);
  font-weight:850;line-height:1.25;
  font-variant-numeric:tabular-nums;
}
.summary-delta {
  font-size:clamp(17px,2.3vw,29px);
  font-weight:750;margin-top:3px;
}
.summary-note {
  color:var(--muted);font-size:clamp(10px,1.1vw,14px);
  margin-top:5px;
}
.asset-list {overflow:auto;min-height:0}
.asset-row {
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:12px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--line);
}
.asset-row:last-child {border-bottom:0}
.asset-name {
  font-size:clamp(15px,1.9vw,23px);font-weight:750;
}
.asset-qty {
  font-size:clamp(11px,1.3vw,16px);
  color:var(--muted);margin-top:3px;
}
.asset-amount {text-align:right}
.asset-value {
  font-size:clamp(18px,2.2vw,29px);
  font-weight:800;font-variant-numeric:tabular-nums;
}
.asset-delta {
  font-size:clamp(12px,1.45vw,18px);
  font-weight:700;margin-top:2px;
  font-variant-numeric:tabular-nums;
}

/* チャート */
.chartwrap {flex:1;min-height:140px}
.chart {width:100%;height:100%}
.gridline {stroke:#29313c;stroke-width:1}
.chartline {
  fill:none;stroke:#edf2f7;stroke-width:3;
  stroke-linecap:round;stroke-linejoin:round;
}
.chartpoint {fill:#edf2f7}
.axis {fill:#a9b4c1;font-size:15px}

/* ニュース */
.news-list {min-height:0;overflow:auto}
.news-item {
  padding:13px 0;border-bottom:1px solid var(--line);
}
.news-item:last-child {border-bottom:0}
.news-source {
  font-size:clamp(12px,1.3vw,17px);color:var(--muted);
}
.news-title {
  font-size:clamp(18px,2.3vw,29px);
  font-weight:800;line-height:1.4;margin-top:6px;
}
.news-description {
  font-size:clamp(13px,1.65vw,20px);
  line-height:1.55;color:#cbd4de;margin-top:8px;
}
.news-link {
  display:inline-block;margin-top:8px;
  color:#9acbff;font-size:clamp(12px,1.3vw,16px);
  text-decoration:none;
}
footer {
  display:flex;justify-content:space-between;
  align-items:center;gap:12px;
}
.status {
  color:var(--muted);font-size:clamp(10px,1.1vw,15px);
}
.dots {
  display:flex;gap:5px;flex-wrap:wrap;
  justify-content:flex-end;max-width:45vw;
}
.dot {width:6px;height:6px;border-radius:50%;background:#3d4652}
.dot.active {background:#fff}

@media(max-height:650px) {
  .card {padding:15px 25px}
  .asset-row {padding:5px 0}
  .summary-top {padding-bottom:8px;margin-bottom:6px}
}
</style>
</head>
<body>
<div class="board">
  <header>
    <div class="date" id="date"></div>
    <div class="clock" id="clock"></div>
  </header>

  <main class="stage" id="stage">
    <section class="page active">
      <div class="card" id="weather">読み込み中…</div>
    </section>

    <section class="page">
      <div class="card">
        <div class="eyebrow">📈 MY ASSETS</div>
        <div class="summary-top" id="summaryTop">
          データ読み込み中…
        </div>
        <div class="asset-list" id="assetRows"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="status" id="status">読み込み中…</div>
    <div class="dots" id="dots"></div>
  </footer>
</div>

<script>
let idx = 0;
let lastSignature = "";

const yen = n => n == null
  ? "—"
  : Math.round(n).toLocaleString("ja-JP") + "円";

const signedYen = n => n == null
  ? "—"
  : (n > 0 ? "+" : n < 0 ? "−" : "±")
    + Math.abs(Math.round(n)).toLocaleString("ja-JP") + "円";

const percent = n => n == null
  ? "—"
  : (n > 0 ? "+" : n < 0 ? "−" : "±")
    + Math.abs(n).toFixed(2) + "%";

const tone = n => n == null ? "flat" :
  n > 0 ? "up" : n < 0 ? "down" : "flat";

const arrow = n => n == null ? "" :
  n > 0 ? "▲ " : n < 0 ? "▼ " : "";

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  }[c]));
}

function chartHTML(history) {
  const v = (history || []).filter(
    x => Number.isFinite(x.value)
  );

  if (v.length < 2) {
    return '<div class="sub">チャートデータなし</div>';
  }

  const W = 900, H = 320;
  const L = 100, R = 28, T = 25, B = 50;

  const values = v.map(x => x.value);
  let min = Math.min(...values);
  let max = Math.max(...values);
  let spread = max - min;

  if (spread === 0) spread = Math.max(Math.abs(max)*0.01,1);

  min -= spread * 0.12;
  max += spread * 0.12;

  const points = v.map((x,i) => ({
    x: L + i * (W-L-R) / (v.length-1),
    y: H-B - (x.value-min)/(max-min)*(H-T-B)
  }));

  let grid = "";
  for (let i=0;i<5;i++) {
    const ratio = i/4;
    const y = T + ratio*(H-T-B);
    const p = max - ratio*(max-min);
    grid += `
      <line class="gridline" x1="${L}" y1="${y}"
        x2="${W-R}" y2="${y}"/>
      <text class="axis" x="${L-12}" y="${y+5}"
        text-anchor="end">${Math.round(p).toLocaleString("ja-JP")}円</text>
    `;
  }

  const line = points.map(p=>`${p.x},${p.y}`).join(" ");
  const step = Math.max(1,Math.ceil(v.length/6));

  const labels = points.map((p,i)=>{
    if (i%step!==0 && i!==v.length-1) return "";
    return `<text class="axis" x="${p.x}" y="${H-14}"
      text-anchor="middle">${escapeHTML(v[i].label)}</text>`;
  }).join("");

  const last = points[points.length-1];

  return `
    <div class="chartwrap">
      <svg class="chart" viewBox="0 0 ${W} ${H}"
        preserveAspectRatio="none">
        ${grid}
        <polyline class="chartline" points="${line}"/>
        <circle class="chartpoint" cx="${last.x}"
          cy="${last.y}" r="5"/>
        ${labels}
      </svg>
    </div>`;
}

function marketPage(asset,type) {
  const config = {
    day: ["1 DAY / TODAY","intraday","change"],
    week:["1 WEEK","week","weekChange"],
    month:["1 MONTH","month","monthChange"]
  }[type];

  const [label,historyKey,changeKey] = config;
  const section = document.createElement("section");
  section.className = "page dynamic";

  section.innerHTML = `
    <div class="card">
      <div class="eyebrow">📈 ${label}</div>
      <div class="assethead">
        <div class="name">${escapeHTML(asset.name)}</div>
        <div class="qty">保有 ${escapeHTML(asset.qtyLabel)}</div>
      </div>
      <div class="metrics">
        <div class="price">${yen(asset.price)}</div>
        <div class="change ${tone(asset[changeKey])}">
          ${percent(asset[changeKey])}
        </div>
      </div>
      ${chartHTML(asset[historyKey])}
      <div class="sub">
        評価額 ${yen(asset.value)}
        ${asset.deltaYen == null ? "" :
          ` ｜ 前日比 <span class="${tone(asset.deltaYen)}">
            Δ ${signedYen(asset.deltaYen)}</span>`}
      </div>
    </div>`;
  return section;
}

function newsPage(asset) {
  const section = document.createElement("section");
  section.className = "page dynamic";
  const news = (asset.news || []).slice(0,2);

  const contents = news.length
    ? news.map((n,i) => `
      <div class="news-item">
        <div class="news-source">
          ${escapeHTML(n.date)}
          ${n.source ? " ｜ " + escapeHTML(n.source) : ""}
        </div>
        <div class="news-title">
          ${i+1}. ${escapeHTML(n.title)}
        </div>
        ${n.description ? `
          <div class="news-description">
            ${escapeHTML(n.description)}
          </div>` : ""}
        ${/^https:\/\//.test(n.link || "") ? `
          <a class="news-link" href="${escapeHTML(n.link)}"
             target="_blank" rel="noopener noreferrer">
            元記事を読む ↗
          </a>` : ""}
      </div>`).join("")
    : '<div class="sub">関連ニュースを取得できませんでした</div>';

  section.innerHTML = `
    <div class="card">
      <div class="eyebrow">📰 COMPANY / INVESTMENT NEWS</div>
      <div class="name" style="margin-bottom:12px">
        ${escapeHTML(asset.name)}
      </div>
      <div class="news-list">${contents}</div>
    </div>`;
  return section;
}

function render(data) {
  const w = data.weather || {};

  document.getElementById("weather").innerHTML = `
    <div class="eyebrow">☀ TODAY'S WEATHER</div>
    <div class="big">札幌 ${escapeHTML(w.text || "—")}</div>
    <div class="temp">
      最高 ${w.max ?? "—"}℃
     　/　最低 ${w.min ?? "—"}℃
    </div>
    <div class="sub">降水確率 ${w.rain ?? "—"}%</div>`;

  const s = data.summary || {};
  const totalText = s.complete ? yen(s.total) : "取得待ち";

  document.getElementById("summaryTop").innerHTML = `
    <div class="summary-label">
      ${escapeHTML(s.label || "株式評価額")}
    </div>
    <div class="summary-total">${totalText}</div>
    <div class="summary-delta ${tone(s.deltaYen)}">
      ${arrow(s.deltaYen)}${signedYen(s.deltaYen)}
      <span style="font-size:.75em">
        （${percent(s.deltaPercent)}）
      </span>
    </div>
    <div class="summary-note">
      前営業日終値比 ｜ eMAXIS・預金は合計対象外
    </div>`;

  document.getElementById("assetRows").innerHTML =
    (data.assets || []).map(a => `
      <div class="asset-row">
        <div>
          <div class="asset-name">${escapeHTML(a.name)}</div>
          <div class="asset-qty">${escapeHTML(a.qtyLabel)}</div>
        </div>
        <div class="asset-amount">
          <div class="asset-value">
            ${a.value == null ? "取得待ち" : yen(a.value)}
          </div>
          <div class="asset-delta ${tone(a.deltaYen)}">
            Δ ${signedYen(a.deltaYen)}
          </div>
        </div>
      </div>`).join("");

  const stage = document.getElementById("stage");
  stage.querySelectorAll(".dynamic").forEach(el=>el.remove());

  (data.assets || []).forEach(asset=>{
    if ((asset.intraday || []).length >= 2) {
      stage.appendChild(marketPage(asset,"day"));
    }
    stage.appendChild(marketPage(asset,"week"));
    stage.appendChild(marketPage(asset,"month"));
    stage.appendChild(newsPage(asset));
  });

  idx = 0;
  const pages = [...document.querySelectorAll(".page")];
  pages.forEach((p,i)=>p.classList.toggle("active",i===0));
  setupDots();

  document.getElementById("status").textContent =
    `更新 ${data.updated_at || "—"} ｜ 画面切替20秒`;
}

function setupDots() {
  const pages = [...document.querySelectorAll(".page")];
  document.getElementById("dots").innerHTML =
    pages.map((_,i)=>`<span class="dot ${i===0?"active":""}"></span>`).join("");
}

function flip() {
  const pages = [...document.querySelectorAll(".page")];
  const dots = [...document.querySelectorAll(".dot")];
  if (!pages.length) return;

  pages[idx].classList.remove("active");
  if (dots[idx]) dots[idx].classList.remove("active");

  idx = (idx+1)%pages.length;

  pages[idx].classList.add("active");
  if (dots[idx]) dots[idx].classList.add("active");
}

function clock() {
  const d = new Date();
  const days = ["日","月","火","水","木","金","土"];
  document.getElementById("date").textContent =
    `${d.getMonth()+1}月${d.getDate()}日（${days[d.getDay()]}）`;
  document.getElementById("clock").textContent =
    d.toLocaleTimeString("ja-JP",{
      hour:"2-digit",minute:"2-digit"
    });
}

async function load() {
  try {
    const response = await fetch("data.json?t="+Date.now());
    if (!response.ok) throw new Error("HTTP "+response.status);

    const data = await response.json();
    const signature = JSON.stringify(data);

    // 同じデータなら画面を最初に戻さない
    if (signature !== lastSignature) {
      lastSignature = signature;
      render(data);
    }
  } catch(e) {
    document.getElementById("status").textContent =
      "データ読み込み失敗：" + e.message;
  }
}

clock();
setInterval(clock,1000);
setInterval(flip,20000);
load();
setInterval(load,15*60*1000);
</script>
</body>
</html>
