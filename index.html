<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Daily Board</title>

<style>
:root{
  --bg:#090c11;
  --panel:#141922;
  --text:#f6f8fb;
  --muted:#9aa6b2;
  --line:#2a313c;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,
  "Helvetica Neue","Noto Sans JP",sans-serif;
}

body{padding:18px 22px}

.board{
  height:100%;
  max-width:1180px;
  margin:auto;
  display:grid;
  grid-template-rows:auto 1fr auto;
  gap:14px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:end;
}

.date{
  font-size:clamp(22px,3vw,40px);
  font-weight:760;
}

.clock{
  font-size:clamp(38px,6vw,74px);
  font-weight:850;
}

/* ---------- PAGE ---------- */

.stage{
  position:relative;
  min-height:0;
}

.page{
  position:absolute;
  inset:0;
  opacity:0;
  transform:scale(.975);
  transition:
    opacity 2s ease,
    transform 2s ease;
  pointer-events:none;
}

.page.active{
  opacity:1;
  transform:scale(1);
}

/* ---------- CARD ---------- */

.card{
  height:100%;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:28px;
  padding:clamp(22px,3.7vw,46px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  overflow:hidden;
}

.eyebrow{
  font-size:clamp(15px,1.7vw,23px);
  color:#dce6f2;
  font-weight:750;
  margin-bottom:15px;
}

.big{
  font-size:clamp(45px,7.3vw,92px);
  font-weight:850;
}

.temp{
  font-size:clamp(28px,4.5vw,55px);
  font-weight:760;
  margin-top:20px;
}

.sub{
  font-size:clamp(14px,1.8vw,23px);
  color:var(--muted);
  margin-top:12px;
}

/* ---------- ASSET TABLE ---------- */

table{
  width:100%;
  border-collapse:collapse;
  font-size:clamp(14px,1.7vw,23px);
}

th{
  color:var(--muted);
  font-size:.76em;
}

th,td{
  padding:10px 8px;
  border-bottom:1px solid var(--line);
  text-align:right;
}

th:first-child,
td:first-child{
  text-align:left;
}

td:first-child{
  font-weight:750;
}

/* ---------- MARKET ---------- */

.assethead{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:20px;
}

.name{
  font-size:clamp(27px,4.4vw,55px);
  font-weight:850;
  line-height:1.15;
}

.qty{
  color:var(--muted);
  font-size:clamp(14px,1.8vw,23px);
  white-space:nowrap;
}

.metrics{
  display:flex;
  gap:28px;
  align-items:baseline;
  margin:8px 0;
}

.price{
  font-size:clamp(28px,4.3vw,52px);
  font-weight:800;
}

.change{
  font-size:clamp(18px,2.5vw,30px);
  font-weight:750;
}

/* ---------- CHART ---------- */

.chartwrap{
  flex:1;
  min-height:170px;
}

.chart{
  width:100%;
  height:100%;
}

.grid{
  stroke:#29313c;
  stroke-width:1;
}

.line{
  fill:none;
  stroke:#edf2f7;
  stroke-width:4;
  stroke-linejoin:round;
  stroke-linecap:round;
}

.point{
  fill:#edf2f7;
}

.axis{
  fill:#8f9aa7;
  font-size:13px;
}

/* ---------- NEWS ---------- */

.news-list{
  display:flex;
  flex-direction:column;
  gap:0;
}

.news-item{
  padding:15px 0;
  border-bottom:1px solid var(--line);
}

.news-item:last-child{
  border-bottom:none;
}

.news-title{
  font-size:clamp(18px,2.3vw,29px);
  line-height:1.35;
  font-weight:800;
}

.news-description{
  margin-top:7px;
  font-size:clamp(14px,1.6vw,20px);
  line-height:1.5;
  color:#cbd4de;
}

.news-source{
  margin-top:5px;
  font-size:clamp(12px,1.3vw,17px);
  color:var(--muted);
}

/* ---------- FOOTER ---------- */

footer{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
}

.status{
  color:var(--muted);
  font-size:clamp(11px,1.2vw,16px);
}

.dots{
  display:flex;
  gap:5px;
  max-width:55vw;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#3d4652;
}

.dot.active{
  background:#fff;
}
</style>
</head>

<body>

<div class="board">

<header>
  <div class="date" id="date"></div>
  <div class="clock" id="clock"></div>
</header>

<main class="stage" id="stage">

  <!-- 天気 -->
  <section class="page active">
    <div class="card" id="weather">
      読み込み中…
    </div>
  </section>

  <!-- 資産一覧 -->
  <section class="page">
    <div class="card">

      <div class="eyebrow">
        📈 MY ASSETS
      </div>

      <table>
        <thead>
          <tr>
            <th>資産</th>
            <th>数量</th>
            <th>現在値</th>
            <th>評価額</th>
            <th>前日比</th>
          </tr>
        </thead>

        <tbody id="assetRows"></tbody>
      </table>

    </div>
  </section>

</main>

<footer>
  <div class="status" id="status">
    データ読み込み中
  </div>

  <div class="dots" id="dots"></div>
</footer>

</div>

<script>

let idx=0;

const yen=n=>
  n==null
  ?"—"
  :Math.round(n).toLocaleString("ja-JP")+"円";

const percent=n=>{
  if(n==null)return "—";
  return (n>=0?"+":"")+n.toFixed(2)+"%";
};

/* ========================================
   グラフ
======================================== */

function chartHTML(history){

  let v=history||[];

  if(v.length<2){
    return `
      <div class="sub">
        チャートデータなし
      </div>
    `;
  }

  const W=900;
  const H=320;

  /* 左側を広くして縦軸価格を表示 */
  const LEFT=90;
  const RIGHT=25;
  const TOP=25;
  const BOTTOM=48;

  let vals=v.map(x=>x.value);

  let dataMin=Math.min(...vals);
  let dataMax=Math.max(...vals);

  let dataRange=dataMax-dataMin;

  if(dataRange===0){
    dataRange=Math.max(dataMax*0.01,1);
  }

  /* 上下に10%余白 */
  let mn=dataMin-dataRange*0.10;
  let mx=dataMax+dataRange*0.10;

  let range=mx-mn;

  let pts=v.map((x,i)=>[

    LEFT+
    i*(W-LEFT-RIGHT)/
    (v.length-1),

    H-BOTTOM-
    (x.value-mn)/range*
    (H-TOP-BOTTOM)

  ]);


  /* -------------------------
     縦軸＋水平グリッド
  ------------------------- */

  let grid="";

  const levels=4;

  for(let i=0;i<levels;i++){

    let ratio=i/(levels-1);

    let y=
      TOP+
      ratio*
      (H-TOP-BOTTOM);

    let price=
      mx-
      ratio*range;

    grid+=`

      <line
        class="grid"
        x1="${LEFT}"
        y1="${y}"
        x2="${W-RIGHT}"
        y2="${y}"
      />

      <text
        class="axis"
        x="${LEFT-12}"
        y="${y+5}"
        text-anchor="end"
      >
        ${Math.round(price).toLocaleString("ja-JP")}円
      </text>

    `;

  }


  /* -------------------------
     株価ライン
  ------------------------- */

  let poly=
    pts.map(p=>p.join(",")).join(" ");


  /* -------------------------
     横軸
  ------------------------- */

  let step=
    Math.max(
      1,
      Math.ceil(v.length/6)
    );

  let labels=
    pts.map((p,i)=>{

      if(
        i%step!==0 &&
        i!==v.length-1
      ){
        return "";
      }

      return `

        <text
          class="axis"
          x="${p[0]}"
          y="${H-14}"
          text-anchor="middle"
        >
          ${v[i].label}
        </text>

      `;

    }).join("");


  /* -------------------------
     最新値の点
  ------------------------- */

  let last=
    pts[pts.length-1];


  return `

    <div class="chartwrap">

      <svg
        class="chart"
        viewBox="0 0 ${W} ${H}"
        preserveAspectRatio="none"
      >

        ${grid}

        <polyline
          class="line"
          points="${poly}"
        />

        <circle
          class="point"
          cx="${last[0]}"
          cy="${last[1]}"
          r="6"
        />

        ${labels}

      </svg>

    </div>

  `;
}


/* ========================================
   市場ページ
======================================== */

function marketPage(asset,type){

  let history=[];
  let label="";
  let change=null;

  if(type==="day"){

    history=asset.intraday||[];
    label="TODAY";
    change=asset.change;

  }

  if(type==="week"){

    history=asset.week||[];
    label="1 WEEK";
    change=asset.weekChange;

  }

  if(type==="month"){

    history=asset.month||[];
    label="1 MONTH";
    change=asset.monthChange;

  }

  let section=
    document.createElement("section");

  section.className=
    "page dynamic";

  section.innerHTML=`

    <div class="card">

      <div class="eyebrow">
        📈 ${label}
      </div>

      <div class="assethead">

        <div class="name">
          ${asset.name}
        </div>

        <div class="qty">
          保有 ${asset.qtyLabel}
        </div>

      </div>

      <div class="metrics">

        <div class="price">
          ${yen(asset.price)}
        </div>

        <div class="change">
          ${percent(change)}
        </div>

      </div>

      ${chartHTML(history)}

      <div class="sub">
        評価額 ${yen(asset.value)}
      </div>

    </div>
  `;

  return section;
}


/* ========================================
   NEWSページ
======================================== */

function newsPage(asset){

  let section=
    document.createElement("section");

  section.className=
    "page dynamic";

  let news=(asset.news||[]).slice(0,3);

  let contents="";

  if(news.length){

    contents=news.map((n,i)=>`

      <div class="news-item">

        <div class="news-title">
          ${i+1}. ${n.title}
        </div>

        ${
          n.description
          ?`
            <div class="news-description">
              ${n.description}
            </div>
          `
          :""
        }

        ${
          n.source
          ?`
            <div class="news-source">
              ${n.source}
            </div>
          `
          :""
        }

      </div>

    `).join("");

  }else{

    contents=`
      <div class="sub">
        関連ニュースを取得できませんでした
      </div>
    `;

  }

  section.innerHTML=`

    <div class="card">

      <div class="eyebrow">
        📰 COMPANY NEWS
      </div>

      <div class="name"
           style="margin-bottom:15px">
        ${asset.name}
      </div>

      <div class="news-list">
        ${contents}
      </div>

    </div>
  `;

  return section;
}


/* ========================================
   全画面生成
======================================== */

function render(d){

  /* ---------- WEATHER ---------- */

  let w=d.weather;

  document
    .getElementById("weather")
    .innerHTML=`

      <div class="eyebrow">
        ☀ TODAY'S WEATHER
      </div>

      <div class="big">
        札幌　${w.text}
      </div>

      <div class="temp">
        最高 ${w.max}℃
        　/　
        最低 ${w.min}℃
      </div>

      <div class="sub">
        降水確率 ${w.rain}%
      </div>
    `;


  /* ---------- 資産一覧 ---------- */

  document
    .getElementById("assetRows")
    .innerHTML=

    d.assets.map(a=>`

      <tr>

        <td>${a.name}</td>

        <td>${a.qtyLabel}</td>

        <td>${yen(a.price)}</td>

        <td>${yen(a.value)}</td>

        <td>${percent(a.change)}</td>

      </tr>

    `).join("");


  let stage=
    document.getElementById("stage");


  /*
    data.jsonを再読み込みした時に
    古いページを削除
  */

  stage
    .querySelectorAll(".dynamic")
    .forEach(x=>x.remove());


  /* ========================================
     各資産

     1日
       ↓
     1週間
       ↓
     1か月
       ↓
     ニュース
  ======================================== */

  d.assets.forEach(asset=>{

    /*
      eMAXISには日中値動きがないので
      1日ページは作らない
    */

    if(
      asset.intraday &&
      asset.intraday.length>1
    ){

      stage.appendChild(
        marketPage(
          asset,
          "day"
        )
      );

    }


    /* 1週間 */

    stage.appendChild(
      marketPage(
        asset,
        "week"
      )
    );


    /* 1か月 */

    stage.appendChild(
      marketPage(
        asset,
        "month"
      )
    );


    /* NEWS */

    stage.appendChild(
      newsPage(asset)
    );

  });


  /* ---------- RESET ---------- */

  idx=0;

  let pages=[
    ...document
      .querySelectorAll(".page")
  ];

  pages.forEach(
    (p,i)=>
      p.classList.toggle(
        "active",
        i===0
      )
  );


  setupDots();


  document
    .getElementById("status")
    .textContent=

    `データ更新 ${d.updated_at} ｜ 画面切替 10秒`;

}


/* ========================================
   DOT
======================================== */

function setupDots(){

  let pages=[
    ...document
      .querySelectorAll(".page")
  ];

  let box=
    document.getElementById("dots");

  box.innerHTML="";

  pages.forEach((_,i)=>{

    let dot=
      document.createElement("span");

    dot.className=
      "dot"+(i===0?" active":"");

    box.appendChild(dot);

  });

}


/* ========================================
   画面切替
======================================== */

function flip(){

  let pages=[
    ...document
      .querySelectorAll(".page")
  ];

  let dots=[
    ...document
      .querySelectorAll(".dot")
  ];

  if(!pages.length)return;


  pages[idx]
    .classList
    .remove("active");

  dots[idx]
    ?.classList
    .remove("active");


  idx=
    (idx+1)%pages.length;


  pages[idx]
    .classList
    .add("active");

  dots[idx]
    ?.classList
    .add("active");

}


/* ========================================
   時計
======================================== */

function clock(){

  let d=new Date();

  let days=[
    "日","月","火",
    "水","木","金","土"
  ];

  document
    .getElementById("date")
    .textContent=

    `${d.getMonth()+1}月${d.getDate()}日（${days[d.getDay()]}）`;


  document
    .getElementById("clock")
    .textContent=

    d.toLocaleTimeString(
      "ja-JP",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}

clock();

setInterval(
  clock,
  1000
);


/* ========================================
   10秒ごとに画面切替
======================================== */

setInterval(
  flip,
  10000
);


/* ========================================
   data.json取得
======================================== */

async function load(){

  try{

    let response=
      await fetch(
        "data.json?t="
        +Date.now()
      );

    if(!response.ok){
      throw new Error(
        "HTTP "+response.status
      );
    }

    let data=
      await response.json();

    render(data);

  }catch(e){

    document
      .getElementById("status")
      .textContent=

      "data.jsonを読み込めません";

  }

}


load();


/*
  GitHub Actionsは3時間ごと。
  iPad側は15分ごとに
  新しいdata.jsonがないか確認。
*/

setInterval(
  load,
  15*60*1000
);

</script>

</body>
</html>
