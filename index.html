<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Daily Board</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #f4f7fb;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Sans",
        "Yu Gothic",
        Meiryo,
        sans-serif;
    }

    #app {
      position: absolute;
      inset: 0;

      padding-top: env(safe-area-inset-top);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);

      background: #000;
    }

    #board {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;

      background:
        radial-gradient(circle at top, #172333, #070c13 65%);
    }

    header {
      height: 72px;
      min-height: 72px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 34px;

      background: rgba(5, 10, 17, 0.72);
    }

    .header-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .header-time {
      font-size: 17px;
      color: #aeb8c7;
    }

    main {
      flex: 1;
      min-height: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 28px 42px 36px;
    }

    #page {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      opacity: 1;
      transition: opacity .7s ease;
    }

    #page.fade {
      opacity: 0;
    }

    .screen {
      width: 100%;
      max-width: 1180px;
      height: 100%;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .eyebrow {
      margin-bottom: 10px;

      font-size: 18px;
      font-weight: 700;
      letter-spacing: .13em;
      color: #7f92aa;
    }

    .title {
      margin: 0 0 24px;

      font-size: clamp(32px, 4vw, 52px);
      line-height: 1.15;
      font-weight: 750;
    }

    .big-value {
      font-size: clamp(58px, 8vw, 100px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -.04em;
    }

    .positive {
      color: #3ee786;
    }

    .negative {
      color: #ff5f68;
    }

    .neutral {
      color: #d9e0ea;
    }

    .muted {
      color: #8f9cad;
    }

    .change-main {
      margin-top: 15px;

      font-size: clamp(25px, 3vw, 42px);
      font-weight: 800;
    }

    .card {
      min-width: 0;

      padding: 22px 24px;

      border: 1px solid rgba(127, 155, 188, .28);
      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          rgba(23, 39, 57, .88),
          rgba(10, 18, 28, .86)
        );
    }

    .card-label {
      margin-bottom: 8px;

      font-size: 16px;
      color: #8e9caf;
    }

    .card-value {
      font-size: clamp(25px, 3vw, 39px);
      font-weight: 750;
    }

    .card-sub {
      margin-top: 8px;

      font-size: 17px;
      color: #a4b0bf;
    }


    /* ------------------------
       2枚目 総資産
       ------------------------ */

    .asset-main {
      display: grid;
      grid-template-columns: 1.25fr .75fr;
      gap: 28px;
      align-items: center;
    }

    .asset-change {
      margin-top: 16px;
      font-size: 28px;
      font-weight: 800;
    }

    .asset-detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;

      margin-top: 26px;
    }

    .purchase-total {
      margin-top: 16px;

      padding: 17px 22px;

      border: 1px solid rgba(127, 155, 188, .22);
      border-radius: 16px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      font-size: 19px;
    }

    .purchase-total strong {
      font-size: 25px;
    }

    .pie-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .pie {
      width: min(29vw, 300px);
      height: min(29vw, 300px);

      border-radius: 50%;

      box-shadow:
        0 0 0 1px rgba(255,255,255,.08),
        0 20px 50px rgba(0,0,0,.25);
    }

    .pie-legend {
      width: 100%;
      max-width: 300px;

      margin-top: 22px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin: 10px 0;

      font-size: 17px;
    }

    .legend-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .legend-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
    }

    .dot-stock {
      background: #5ca7ff;
    }

    .dot-fund {
      background: #3ee786;
    }


    /* ------------------------
       3枚目 日本株
       ------------------------ */

    .stock-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .stock-card {
      padding: 20px 22px;

      border-radius: 19px;
      border: 1px solid rgba(127, 155, 188, .28);

      background:
        linear-gradient(
          145deg,
          rgba(23, 39, 57, .88),
          rgba(10, 18, 28, .86)
        );
    }

    .stock-name {
      margin-bottom: 13px;

      font-size: 22px;
      font-weight: 750;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 6px 0;

      font-size: 17px;
    }

    .info-label {
      color: #8e9caf;
    }

    .info-value {
      font-weight: 700;
      text-align: right;
    }

    .price-main {
      font-size: 27px;
      font-weight: 800;
    }


    /* ------------------------
       4枚目 投資信託
       ------------------------ */

    .fund-card {
      width: 100%;

      padding: 32px;

      border-radius: 24px;
      border: 1px solid rgba(76, 141, 215, .38);

      background:
        linear-gradient(
          145deg,
          rgba(19, 39, 60, .94),
          rgba(8, 17, 27, .92)
        );
    }

    .fund-name {
      margin-bottom: 24px;

      font-size: clamp(26px, 4vw, 42px);
      font-weight: 750;
    }

    .fund-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    .fund-item {
      padding: 18px 20px;

      border-radius: 16px;

      background: rgba(255,255,255,.035);
      border: 1px solid rgba(127,155,188,.18);
    }

    .fund-label {
      margin-bottom: 7px;

      font-size: 16px;
      color: #8e9caf;
    }

    .fund-value {
      font-size: clamp(24px, 3vw, 37px);
      font-weight: 750;
    }


    /* ------------------------
       天気
       ------------------------ */

    .weather-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 18px;
    }


    .error {
      font-size: 24px;
      color: #ff7279;
    }


    @media (max-width: 850px) {

      header {
        padding: 0 20px;
      }

      main {
        padding: 22px 20px 28px;
      }

      .asset-main {
        grid-template-columns: 1fr 1fr;
      }

      .stock-grid {
        grid-template-columns: repeat(2, minmax(0,1fr));
      }

      .pie {
        width: 220px;
        height: 220px;
      }
    }
  </style>
</head>


<body>

<div id="app">

  <div id="board">

    <header>
      <div class="header-title">
        DAILY BOARD
      </div>

      <div
        id="updated"
        class="header-time"
      >
        Loading...
      </div>
    </header>


    <main>
      <div id="page"></div>
    </main>

  </div>

</div>


<script>

  /*
    今回はテスト用に5秒間隔
  */
  const PAGE_INTERVAL = 5000;
  const FADE_TIME = 500;


  let pages = [];
  let pageIndex = 0;
  let rotationTimer = null;


  const page =
    document.getElementById("page");

  const updated =
    document.getElementById("updated");


  function yen(value) {

    if (
      value === null ||
      value === undefined ||
      Number.isNaN(Number(value))
    ) {
      return "—";
    }

    return Math.round(Number(value))
      .toLocaleString("ja-JP") + "円";
  }


  function priceYen(value) {

    if (
      value === null ||
      value === undefined ||
      Number.isNaN(Number(value))
    ) {
      return "—";
    }

    return Number(value)
      .toLocaleString(
        "ja-JP",
        {
          maximumFractionDigits: 2
        }
      ) + "円";
  }


  function signedYen(value) {

    if (
      value === null ||
      value === undefined ||
      Number.isNaN(Number(value))
    ) {
      return "—";
    }

    const n =
      Math.round(Number(value));

    if (n > 0) {
      return "+" +
        n.toLocaleString("ja-JP") +
        "円";
    }

    if (n < 0) {
      return n.toLocaleString("ja-JP") +
        "円";
    }

    return "±0円";
  }


  function percent(value) {

    if (
      value === null ||
      value === undefined ||
      Number.isNaN(Number(value))
    ) {
      return "—";
    }

    const n = Number(value);

    return (
      n > 0 ? "+" : ""
    ) +
      n.toFixed(2) +
      "%";
  }


  function directionClass(value) {

    const n = Number(value);

    if (n > 0) {
      return "positive";
    }

    if (n < 0) {
      return "negative";
    }

    return "neutral";
  }


  function arrow(value) {

    const n = Number(value);

    if (n > 0) {
      return "▲";
    }

    if (n < 0) {
      return "▼";
    }

    return "―";
  }


  /*
    1枚目
    天気

    今回はまだ大きく変更しない
  */
  function weatherPage(data) {

    const w =
      data.weather || {};

    return `
      <div class="screen">

        <div class="eyebrow">
          SAPPORO
        </div>

        <h1 class="title">
          札幌の天気
        </h1>

        <div class="weather-grid">

          <div class="card">

            <div class="card-label">
              現在
            </div>

            <div class="big-value">
              ${
                w.temperature !== undefined
                  ? Math.round(w.temperature) + "°C"
                  : "—"
              }
            </div>

            <div class="card-sub">
              ${
                w.weather ||
                w.description ||
                ""
              }
            </div>

          </div>


          <div class="card">

            <div class="card-label">
              今日
            </div>

            <div class="card-value">

              ${
                w.min !== undefined
                  ? Math.round(w.min) + "°"
                  : "—"
              }

              /

              ${
                w.max !== undefined
                  ? Math.round(w.max) + "°"
                  : "—"
              }

            </div>

            <div class="card-sub">

              降水確率

              ${
                w.precipitation !== undefined
                  ? Math.round(w.precipitation) + "%"
                  : "—"
              }

            </div>

          </div>

        </div>

      </div>
    `;
  }


  /*
    2枚目
    総資産
  */
  function totalAssetsPage(data) {

    const assets =
      data.assets || [];


    const stocks =
      assets.filter(
        a =>
          a.type !== "fund" &&
          a.code !== "03311187"
      );


    const fund =
      assets.find(
        a =>
          a.type === "fund" ||
          a.code === "03311187"
      );


    /*
      日本株の現在評価額
    */
    const stockValue =
      stocks.reduce(
        (sum, a) =>
          sum + Number(a.value || 0),
        0
      );


    /*
      日本株の取得総額

      各株の
      取得単価 × 保有株数
    */
    const stockPurchase =
      stocks.reduce(
        (sum, a) =>
          sum +
          Number(a.cost || 0) *
          Number(a.qty || 0),
        0
      );


    /*
      投資信託
    */
    const fundValue =
      fund
        ? Number(fund.value || 0)
        : 0;


    /*
      投資信託取得額

      data.jsonにpurchaseがあれば使用。
      なければ
      取得基準価額 × 口数 ÷ 10000
    */
    const fundPurchase =
      fund
        ? (
            fund.purchase !== undefined
              ? Number(fund.purchase)
              : (
                  Number(fund.cost || 0) *
                  Number(fund.qty || 0) /
                  10000
                )
          )
        : 0;


    const totalValue =
      stockValue +
      fundValue;


    const totalPurchase =
      stockPurchase +
      fundPurchase;


    const totalGain =
      totalValue -
      totalPurchase;


    const totalGainPct =
      totalPurchase > 0
        ? totalGain /
          totalPurchase *
          100
        : 0;


    /*
      円グラフ割合
    */
    const stockPct =
      totalValue > 0
        ? stockValue /
          totalValue *
          100
        : 0;


    const fundPct =
      totalValue > 0
        ? fundValue /
          totalValue *
          100
        : 0;


    const pieBackground =
      `conic-gradient(
        #5ca7ff 0% ${stockPct}%,
        #3ee786 ${stockPct}% 100%
      )`;


    return `
      <div class="screen">

        <div class="eyebrow">
          TOTAL ASSETS
        </div>

        <div class="asset-main">


          <div>

            <h1 class="title">
              総資産額
            </h1>


            <div class="big-value">
              ${yen(totalValue)}
            </div>


            <div
              class="
                asset-change
                ${directionClass(totalGain)}
              "
            >

              取得総額から

              ${arrow(totalGain)}

              ${signedYen(totalGain)}

              （${percent(totalGainPct)}）

            </div>


            <div class="asset-detail-grid">


              <div class="card">

                <div class="card-label">
                  日本株式
                </div>

                <div class="card-value">
                  ${yen(stockValue)}
                </div>

                <div class="card-sub">
                  取得額
                  ${yen(stockPurchase)}
                </div>

              </div>


              <div class="card">

                <div class="card-label">
                  投資信託
                </div>

                <div class="card-value">
                  ${yen(fundValue)}
                </div>

                <div class="card-sub">
                  取得額
                  ${yen(fundPurchase)}
                </div>

              </div>

            </div>


            <div class="purchase-total">

              <span class="muted">
                取得総額
              </span>

              <strong>
                ${yen(totalPurchase)}
              </strong>

            </div>

          </div>


          <div class="pie-area">

            <div
              class="pie"
              style="
                background:
                  ${pieBackground};
              "
            ></div>


            <div class="pie-legend">

              <div class="legend-row">

                <div class="legend-left">

                  <span
                    class="
                      legend-dot
                      dot-stock
                    "
                  ></span>

                  日本株式

                </div>

                <strong>
                  ${stockPct.toFixed(1)}%
                </strong>

              </div>


              <div class="legend-row">

                <div class="legend-left">

                  <span
                    class="
                      legend-dot
                      dot-fund
                    "
                  ></span>

                  投資信託

                </div>

                <strong>
                  ${fundPct.toFixed(1)}%
                </strong>

              </div>

            </div>

          </div>


        </div>

      </div>
    `;
  }


  /*
    3枚目
    日本株
  */
  function japaneseStocksPage(data) {

    const stocks =
      (data.assets || [])
        .filter(
          a =>
            a.type !== "fund" &&
            a.code !== "03311187"
        );


    return `
      <div class="screen">

        <div class="eyebrow">
          JAPANESE STOCKS
        </div>

        <h1 class="title">
          日本株式
        </h1>


        <div class="stock-grid">

          ${
            stocks.map(stock => {

              /*
                前日からの資産増減額

                data.jsonのdeltaYenが
                すでに保有資産全体のΔなら
                それを使用。

                なければ
                1株あたりのdelta × 株数
              */

              let assetDelta;

              if (
                stock.deltaYen !== undefined &&
                stock.deltaYen !== null
              ) {

                assetDelta =
                  Number(stock.deltaYen);

              } else {

                assetDelta =
                  Number(stock.delta || 0) *
                  Number(stock.qty || 0);

              }


              return `

                <div class="stock-card">

                  <div class="stock-name">
                    ${stock.name || stock.code}
                  </div>


                  <div class="info-row">

                    <span class="info-label">
                      現在価格
                    </span>

                    <span class="price-main">
                      ${priceYen(stock.price)}
                    </span>

                  </div>


                  <div class="info-row">

                    <span class="info-label">
                      取得価格
                    </span>

                    <span class="info-value">
                      ${priceYen(stock.cost)}
                    </span>

                  </div>


                  <div class="info-row">

                    <span class="info-label">
                      前日比
                    </span>

                    <span
                      class="
                        info-value
                        ${directionClass(stock.change)}
                      "
                    >

                      ${arrow(stock.change)}

                      ${percent(stock.change)}

                    </span>

                  </div>


                  <div class="info-row">

                    <span class="info-label">
                      評価総額
                    </span>

                    <span class="info-value">
                      ${yen(stock.value)}
                    </span>

                  </div>


                  <div class="info-row">

                    <span class="info-label">
                      前日からのΔ
                    </span>

                    <span
                      class="
                        info-value
                        ${directionClass(assetDelta)}
                      "
                    >

                      ${arrow(assetDelta)}

                      ${signedYen(assetDelta)}

                    </span>

                  </div>

                </div>

              `;

            }).join("")
          }

        </div>

      </div>
    `;
  }


  /*
    4枚目
    投資信託
  */
  function investmentFundPage(data) {

    const fund =
      (data.assets || [])
        .find(
          a =>
            a.type === "fund" ||
            a.code === "03311187"
        );


    if (!fund) {

      return `
        <div class="screen">

          <div class="eyebrow">
            INVESTMENT FUND
          </div>

          <h1 class="title">
            投資信託
          </h1>

          <div class="error">
            投資信託データを取得できませんでした
          </div>

        </div>
      `;
    }


    return `
      <div class="screen">

        <div class="eyebrow">
          INVESTMENT FUND
        </div>

        <h1 class="title">
          投資信託
        </h1>


        <div class="fund-card">

          <div class="fund-name">
            ${fund.name}
          </div>


          <div class="fund-grid">


            <div class="fund-item">

              <div class="fund-label">
                現在価格
              </div>

              <div class="fund-value">
                ${priceYen(fund.price)}
              </div>

            </div>


            <div class="fund-item">

              <div class="fund-label">
                取得価格
              </div>

              <div class="fund-value">
                ${priceYen(fund.cost)}
              </div>

            </div>


            <div class="fund-item">

              <div class="fund-label">
                前日比
              </div>

              <div
                class="
                  fund-value
                  ${directionClass(fund.change)}
                "
              >

                ${arrow(fund.change)}

                ${percent(fund.change)}

              </div>

            </div>


            <div class="fund-item">

              <div class="fund-label">
                評価総額
              </div>

              <div class="fund-value">
                ${yen(fund.value)}
              </div>

            </div>


            <div class="fund-item">

              <div class="fund-label">
                前日からのΔ
              </div>

              <div
                class="
                  fund-value
                  ${directionClass(fund.deltaYen)}
                "
              >

                ${arrow(fund.deltaYen)}

                ${signedYen(fund.deltaYen)}

              </div>

            </div>


          </div>

        </div>

      </div>
    `;
  }


  /*
    今回は4ページのみ。

    ニュースなし。
    株価グラフなし。
  */
  function buildPages(data) {

    pages = [

      weatherPage(data),

      totalAssetsPage(data),

       investmentFundPage(data),

      japaneseStocksPage(data)

     

    ];

    pageIndex = 0;
  }


  function renderPage(index) {

    if (!pages.length) {

      page.innerHTML = `
        <div class="error">
          表示できるデータがありません
        </div>
      `;

      return;
    }


    page.innerHTML =
      pages[
        index % pages.length
      ];
  }


  function startRotation() {

    if (rotationTimer) {
      clearInterval(rotationTimer);
    }


    renderPage(pageIndex);


    rotationTimer =
      setInterval(
        () => {

          page.classList.add("fade");


          setTimeout(
            () => {

              pageIndex =
                (pageIndex + 1) %
                pages.length;


              renderPage(pageIndex);


              requestAnimationFrame(
                () => {
                  page.classList.remove(
                    "fade"
                  );
                }
              );

            },
            FADE_TIME
          );

        },
        PAGE_INTERVAL
      );
  }


  async function loadData() {

    try {

      const response =
        await fetch(
          `data.json?t=${Date.now()}`,
          {
            cache: "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      const data =
        await response.json();


      updated.textContent =
        data.updated
          ? "更新 " + data.updated
          : "更新済み";


      buildPages(data);

      startRotation();


    } catch (error) {

      console.error(error);


      updated.textContent =
        "データ取得エラー";


      page.innerHTML = `
        <div class="error">
          data.json を読み込めませんでした
        </div>
      `;

    }
  }


  loadData();


  /*
    data.jsonは15分ごとに再読み込み
  */
  setInterval(
    loadData,
    15 * 60 * 1000
  );

</script>

</body>
</html>
