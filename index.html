<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Daily Board</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000000;
}

body {
    color: #f5f7fa;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;

    overflow: hidden;
}

#app {
    position: absolute;
    inset: 0;

    padding-top: env(safe-area-inset-top);
    padding-right: env(safe-area-inset-right);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);

    background: #000000;
}

#board {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

    background:
        radial-gradient(
            circle at top,
            #172333,
            #070c13 65%
        );
}


/* =========================
   HEADER
========================= */

header {
    height: 72px;
    min-height: 72px;

    padding: 0 34px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background:
        rgba(5,10,17,0.72);

    border: none;
}

.brand {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.12em;
}

.header-right {
    display: flex;
    gap: 26px;
    align-items: center;

    color: #aab6c7;

    font-size: 15px;
}


/* =========================
   PAGE
========================= */

#screen {
    position: relative;
    flex: 1;
    min-height: 0;
}

.page {
    position: absolute;
    inset: 0;

    padding: 30px 46px;

    opacity: 0;

    transition:
        opacity 2s ease;

    pointer-events: none;
}

.page.active {
    opacity: 1;
    pointer-events: auto;
}

.eyebrow {
    color: #8392a7;

    font-size: 14px;
    font-weight: 700;

    letter-spacing: 0.18em;

    margin-bottom: 11px;
}

.page-title {
    margin: 0;

    font-size: 46px;
    line-height: 1.08;
}


/* =========================
   WEATHER
========================= */

.weather-wrap {
    height: 100%;

    display: flex;
    flex-direction: column;
    justify-content: center;
}

.weather-main {
    display: flex;
    align-items: flex-end;

    gap: 35px;

    margin-top: 20px;
}

.weather-text {
    font-size: 72px;
    font-weight: 800;
}

.weather-temp {
    font-size: 32px;

    color: #c6d0dd;

    padding-bottom: 10px;
}

.weather-rain {
    margin-top: 24px;

    font-size: 22px;

    color: #9caabd;
}


/* =========================
   COLORS
========================= */

.positive {
    color: #38d996;
}

.negative {
    color: #ff6873;
}

.neutral {
    color: #9ba7b7;
}


/* =========================
   TOTAL ASSETS
========================= */

.total-page {
    height: 100%;

    display: flex;
    flex-direction: column;
    justify-content: center;
}

.total-label {
    color: #a4afbd;

    font-size: 18px;
    font-weight: 650;
}

.total-value {
    margin-top: 5px;

    font-size: 62px;
    font-weight: 850;

    letter-spacing: -0.04em;
}

.total-change {
    margin-top: 10px;

    font-size: 26px;
    font-weight: 800;
}

.total-cost {
    margin-top: 9px;

    color: #8997aa;

    font-size: 16px;
}

.total-profit {
    margin-top: 4px;

    font-size: 17px;
    font-weight: 700;
}

.total-breakdown {
    margin-top: 34px;

    display: grid;

    grid-template-columns:
        1fr
        1fr;

    gap: 18px;
}

.total-card {
    padding: 22px 25px;

    border:
        1px solid
        rgba(255,255,255,0.09);

    border-radius: 18px;

    background:
        rgba(9,16,26,0.72);
}

.total-card-label {
    color: #8997aa;

    font-size: 14px;
    font-weight: 650;
}

.total-card-value {
    margin-top: 7px;

    font-size: 28px;
    font-weight: 800;
}


/* =========================
   ASSET TABLE
========================= */

.asset-page {
    padding-top: 22px;
}

.asset-top {
    display: flex;

    align-items: flex-end;
    justify-content: space-between;

    gap: 30px;

    margin-bottom: 20px;
}

.asset-total-label {
    color: #a4afbd;

    font-size: 16px;

    margin-bottom: 5px;
}

.asset-total {
    font-size: 45px;
    font-weight: 800;

    letter-spacing: -0.03em;
}

.asset-purchase-total {
    margin-top: 4px;

    color: #8794a6;

    font-size: 14px;
    font-weight: 600;
}

.asset-total-change {
    text-align: right;

    font-size: 24px;
    font-weight: 800;

    padding-bottom: 5px;
}

.asset-table {
    width: 100%;

    border:
        1px solid
        rgba(255,255,255,0.09);

    border-radius: 18px;

    overflow: hidden;

    background:
        rgba(10,17,27,0.72);

    box-shadow:
        0 18px 60px
        rgba(0,0,0,0.25);
}

.asset-head,
.asset-row {
    display: grid;

    grid-template-columns:
        2fr
        1.2fr
        1.15fr
        1.5fr;

    align-items: center;
}

.asset-head {
    min-height: 48px;

    padding: 0 25px;

    background:
        rgba(255,255,255,0.045);

    color: #8f9db0;

    font-size: 14px;
    font-weight: 700;
}

.asset-row {
    min-height: 84px;

    padding: 9px 25px;

    border-top:
        1px solid
        rgba(255,255,255,0.07);
}

.asset-name {
    font-size: 20px;
    font-weight: 750;
}

.asset-qty {
    margin-top: 5px;

    color: #8794a6;

    font-size: 14px;
}

.asset-price {
    font-size: 21px;
    font-weight: 750;
}

.asset-cost {
    margin-top: 5px;

    color: #8390a2;

    font-size: 13px;
    font-weight: 600;
}

.asset-day-change {
    font-size: 20px;
    font-weight: 800;
}

.asset-value {
    font-size: 22px;
    font-weight: 800;
}

.asset-delta {
    margin-top: 5px;

    color: #8794a6;

    font-size: 13px;
    font-weight: 650;
}


/* =========================
   FUND
========================= */

.fund-page {
    height: 100%;

    display: flex;
    flex-direction: column;
}

.fund-main-card {
    margin-top: 18px;

    padding: 25px 28px;

    border:
        1px solid
        rgba(255,255,255,0.09);

    border-radius: 20px;

    background:
        rgba(9,16,26,0.76);
}

.fund-name {
    font-size: 31px;
    font-weight: 800;
}

.fund-qty {
    margin-top: 6px;

    color: #8997aa;

    font-size: 15px;
}

.fund-grid {
    margin-top: 24px;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 14px;
}

.fund-item {
    padding: 16px 18px;

    border-radius: 14px;

    background:
        rgba(255,255,255,0.04);
}

.fund-item-label {
    color: #8997aa;

    font-size: 13px;
}

.fund-item-value {
    margin-top: 7px;

    font-size: 23px;
    font-weight: 800;
}

.fund-item-sub {
    margin-top: 5px;

    color: #7f8da0;

    font-size: 12px;
}


/* =========================
   MARKET
========================= */

.market-page {
    height: 100%;

    display: flex;
    flex-direction: column;
}

.market-top {
    display: flex;

    justify-content: space-between;
    align-items: flex-end;

    gap: 20px;
}

.market-name {
    font-size: 40px;
    font-weight: 800;
}

.market-price {
    margin-top: 7px;

    font-size: 24px;

    color: #c8d1dd;
}

.market-change {
    font-size: 27px;
    font-weight: 800;
}

.chart-card {
    flex: 1;
    min-height: 0;

    margin-top: 20px;

    border:
        1px solid
        rgba(255,255,255,0.08);

    border-radius: 20px;

    background:
        rgba(9,15,24,0.75);

    padding: 20px;
}

.chart-card svg {
    width: 100%;
    height: 100%;

    overflow: visible;
}


/* =========================
   NEWS
========================= */

.news-page {
    height: 100%;

    display: flex;
    flex-direction: column;
    justify-content: center;
}

.news-card {
    width: 100%;

    max-width: 1100px;

    padding: 38px 42px;

    border:
        1px solid
        rgba(255,255,255,0.09);

    border-radius: 22px;

    background:
        rgba(9,16,26,0.78);
}

.news-date {
    color: #8493a6;

    font-size: 14px;

    margin-bottom: 15px;
}

.news-title {
    font-size: 34px;

    line-height: 1.3;

    font-weight: 800;
}

.news-description {
    margin-top: 22px;

    color: #c0cad7;

    font-size: 19px;

    line-height: 1.7;
}

.news-source {
    margin-top: 24px;

    color: #7f8da0;

    font-size: 14px;
}

.news-link {
    color: inherit;
    text-decoration: none;
}

</style>

</head>


<body>

<div id="app">

<div id="board">

<header>

<div class="brand">
    DAILY BOARD
</div>

<div class="header-right">

<div id="updated">
    —
</div>

<div id="clock">
    —
</div>

</div>

</header>

<div id="screen"></div>

</div>

</div>


<script>

const screen =
    document.getElementById("screen");

let pages = [];

let pageIndex = 0;

let pageTimer = null;


/* =========================
   FORMAT
========================= */

function yen(value) {

    if (
        value === null ||
        value === undefined ||
        Number.isNaN(Number(value))
    ) {
        return "—";
    }

    return "¥" +
        Math.round(
            Number(value)
        ).toLocaleString(
            "ja-JP"
        );
}


function priceYen(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "—";
    }

    const n =
        Number(value);

    const decimals =
        Number.isInteger(n)
        ? 0
        : 1;

    return "¥" +
        n.toLocaleString(
            "ja-JP",
            {
                minimumFractionDigits:
                    decimals,

                maximumFractionDigits:
                    2
            }
        );
}


function signedYen(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "—";
    }

    const n =
        Math.round(
            Number(value)
        );

    if (n > 0) {

        return "+¥" +
            n.toLocaleString(
                "ja-JP"
            );
    }

    if (n < 0) {

        return "−¥" +
            Math.abs(n)
            .toLocaleString(
                "ja-JP"
            );
    }

    return "±¥0";
}


function percent(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "—";
    }

    const n =
        Number(value);

    if (n > 0) {

        return "+" +
            n.toFixed(2) +
            "%";
    }

    if (n < 0) {

        return "−" +
            Math.abs(n)
            .toFixed(2) +
            "%";
    }

    return "0.00%";
}


function directionClass(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "neutral";
    }

    if (Number(value) > 0) {
        return "positive";
    }

    if (Number(value) < 0) {
        return "negative";
    }

    return "neutral";
}


function arrow(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    if (Number(value) > 0) {
        return "▲";
    }

    if (Number(value) < 0) {
        return "▼";
    }

    return "•";
}


/* =========================
   PAGE
========================= */

function addPage(content) {

    const div =
        document.createElement(
            "section"
        );

    div.className =
        "page";

    div.innerHTML =
        content;

    screen.appendChild(
        div
    );

    pages.push(
        div
    );
}


/* =========================
   WEATHER
========================= */

function weatherPage(data) {

    const w =
        data.weather || {};

    addPage(`

        <div class="weather-wrap">

            <div class="eyebrow">
                SAPPORO WEATHER
            </div>

            <h1 class="page-title">
                今日の札幌
            </h1>

            <div class="weather-main">

                <div class="weather-text">
                    ${w.text ?? "—"}
                </div>

                <div class="weather-temp">

                    最高
                    ${w.max ?? "—"}℃

                    &nbsp;&nbsp;

                    最低
                    ${w.min ?? "—"}℃

                </div>

            </div>

            <div class="weather-rain">

                降水確率
                ${w.rain ?? "—"}%

            </div>

        </div>
    `);
}


/* =========================
   TOTAL ASSETS
========================= */

function totalSummaryPage(data) {

    const s =
        data.totalSummary || {};

    const stocks =
        (data.assets || [])
        .filter(
            a =>
            a.type === "stock"
        );

    const fund =
        (data.assets || [])
        .find(
            a =>
            a.type === "fund"
        );


    const stockValue =
        stocks.reduce(
            (sum, a) =>
                sum +
                (
                    Number(a.value)
                    || 0
                ),
            0
        );


    const fundValue =
        fund &&
        fund.value !== null
        ?
        Number(fund.value)
        :
        null;


    const deltaClass =
        directionClass(
            s.deltaYen
        );


    const profitClass =
        directionClass(
            s.unrealizedYen
        );


    addPage(`

        <div class="total-page">

            <div class="eyebrow">
                TOTAL ASSETS
            </div>

            <div class="total-label">
                総資産評価額
            </div>

            <div class="total-value">
                ${yen(s.total)}
            </div>

            <div
                class="
                    total-change
                    ${deltaClass}
                "
            >

                ${arrow(s.deltaYen)}

                ${signedYen(
                    s.deltaYen
                )}

                &nbsp;

                ${percent(
                    s.deltaPercent
                )}

            </div>

            <div class="total-cost">

                総取得額
                ${yen(
                    s.purchaseTotal
                )}

            </div>

            <div
                class="
                    total-profit
                    ${profitClass}
                "
            >

                評価損益

                ${signedYen(
                    s.unrealizedYen
                )}

                &nbsp;

                ${percent(
                    s.unrealizedPercent
                )}

            </div>


            <div class="total-breakdown">

                <div class="total-card">

                    <div class="total-card-label">
                        日本株
                    </div>

                    <div class="total-card-value">
                        ${yen(stockValue)}
                    </div>

                </div>


                <div class="total-card">

                    <div class="total-card-label">
                        投資信託
                    </div>

                    <div class="total-card-value">
                        ${yen(fundValue)}
                    </div>

                </div>

            </div>

        </div>
    `);
}


/* =========================
   STOCK SUMMARY
========================= */

function stockSummaryPage(data) {

    const summary =
        data.summary || {};

    const assets =
        (data.assets || [])
        .filter(
            a =>
            a.type === "stock"
        );


    const totalClass =
        directionClass(
            summary.deltaYen
        );


    const rows =
        assets.map(
            a => {

                const cls =
                    directionClass(
                        a.change
                    );


                return `

                    <div class="asset-row">

                        <div>

                            <div class="asset-name">
                                ${a.name}
                            </div>

                            <div class="asset-qty">
                                ${a.qtyLabel}
                            </div>

                        </div>


                        <div>

                            <div class="asset-price">
                                ${priceYen(a.price)}
                            </div>

                            <div class="asset-cost">

                                取得
                                ${priceYen(a.cost)}

                            </div>

                        </div>


                        <div
                            class="
                                asset-day-change
                                ${cls}
                            "
                        >

                            ${arrow(a.change)}

                            ${percent(a.change)}

                        </div>


                        <div>

                            <div class="asset-value">
                                ${yen(a.value)}
                            </div>

                            <div class="asset-delta">

                                Δ
                                ${signedYen(
                                    a.deltaYen
                                )}

                            </div>

                        </div>

                    </div>
                `;
            }
        )
        .join("");


    addPage(`

        <div class="asset-page">

            <div class="eyebrow">
                JAPANESE STOCKS
            </div>


            <div class="asset-top">

                <div>

                    <div class="asset-total-label">
                        日本株評価額
                    </div>

                    <div class="asset-total">
                        ${yen(summary.total)}
                    </div>

                    <div class="asset-purchase-total">

                        総取得額
                        ${yen(
                            summary.purchaseTotal
                        )}

                    </div>

                </div>


                <div
                    class="
                        asset-total-change
                        ${totalClass}
                    "
                >

                    ${arrow(
                        summary.deltaYen
                    )}

                    ${signedYen(
                        summary.deltaYen
                    )}

                    &nbsp;

                    ${percent(
                        summary.deltaPercent
                    )}

                </div>

            </div>


            <div class="asset-table">

                <div class="asset-head">

                    <div>銘柄</div>

                    <div>株単価</div>

                    <div>前日比</div>

                    <div>評価額</div>

                </div>

                ${rows}

            </div>

        </div>
    `);
}


/* =========================
   FUND SUMMARY
========================= */

function fundSummaryPage(data) {

    const fund =
        (data.assets || [])
        .find(
            a =>
            a.type === "fund"
        );


    if (!fund) {
        return;
    }


    const changeClass =
        directionClass(
            fund.change
        );


    const profitClass =
        directionClass(
            fund.unrealizedYen
        );


    addPage(`

        <div class="fund-page">

            <div class="eyebrow">
                INVESTMENT FUND
            </div>


            <div class="fund-main-card">

                <div class="fund-name">
                    ${fund.name}
                </div>

                <div class="fund-qty">
                    ${fund.qtyLabel}
                </div>


                <div class="fund-grid">


                    <div class="fund-item">

                        <div class="fund-item-label">
                            基準価額
                        </div>

                        <div class="fund-item-value">
                            ${priceYen(
                                fund.price
                            )}
                        </div>

                        <div class="fund-item-sub">

                            取得
                            ${priceYen(
                                fund.cost
                            )}

                        </div>

                    </div>


                    <div class="fund-item">

                        <div class="fund-item-label">
                            前日比
                        </div>

                        <div
                            class="
                                fund-item-value
                                ${changeClass}
                            "
                        >

                            ${arrow(
                                fund.change
                            )}

                            ${percent(
                                fund.change
                            )}

                        </div>

                        <div class="fund-item-sub">

                            基準価額差
                            ${signedYen(
                                fund.price !== null &&
                                fund.previousClose !== null
                                ?
                                fund.price -
                                fund.previousClose
                                :
                                null
                            )}

                        </div>

                    </div>


                    <div class="fund-item">

                        <div class="fund-item-label">
                            評価額
                        </div>

                        <div class="fund-item-value">
                            ${yen(
                                fund.value
                            )}
                        </div>

                        <div class="fund-item-sub">

                            前日差
                            ${signedYen(
                                fund.deltaYen
                            )}

                        </div>

                    </div>


                    <div class="fund-item">

                        <div class="fund-item-label">
                            評価損益
                        </div>

                        <div
                            class="
                                fund-item-value
                                ${profitClass}
                            "
                        >

                            ${signedYen(
                                fund.unrealizedYen
                            )}

                        </div>

                        <div class="fund-item-sub">

                            ${percent(
                                fund.unrealizedPercent
                            )}

                        </div>

                    </div>


                </div>

            </div>

        </div>
    `);
}


/* =========================
   CHART
========================= */

function chartHTML(points) {

    if (
        !points ||
        points.length < 2
    ) {

        return `

            <div
                style="
                    height:100%;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    color:#7e8a99;
                "
            >
                データ取得待ち
            </div>
        `;
    }


    const width = 1000;

    const height = 430;

    const left = 82;

    const right = 28;

    const top = 22;

    const bottom = 48;


    const values =
        points.map(
            p =>
            Number(p.value)
        );


    let min =
        Math.min(
            ...values
        );


    let max =
        Math.max(
            ...values
        );


    if (min === max) {

        min -= 1;
        max += 1;
    }


    const range =
        max - min;


    min -=
        range * 0.08;


    max +=
        range * 0.08;


    const plotWidth =
        width -
        left -
        right;


    const plotHeight =
        height -
        top -
        bottom;


    const x = i =>

        left +

        (
            i /
            (
                points.length - 1
            )
        )

        * plotWidth;


    const y = value =>

        top +

        (
            (
                max - value
            )
            /
            (
                max - min
            )
        )

        * plotHeight;


    const polyline =
        points.map(
            (p, i) =>
                `${x(i)},${y(p.value)}`
        )
        .join(" ");


    let grid = "";


    for (
        let i = 0;
        i < 5;
        i++
    ) {

        const ratio =
            i / 4;


        const gy =
            top +
            ratio *
            plotHeight;


        const value =
            max -
            ratio *
            (
                max - min
            );


        grid += `

            <line
                x1="${left}"
                y1="${gy}"
                x2="${width-right}"
                y2="${gy}"
                stroke="rgba(255,255,255,0.08)"
                stroke-width="1"
            />


            <text
                x="${left-12}"
                y="${gy+5}"
                text-anchor="end"
                fill="#748195"
                font-size="13"
            >

                ¥${Math.round(value)
                    .toLocaleString(
                        "ja-JP"
                    )}

            </text>
        `;
    }


    const labelIndexes =
        [
            0,

            Math.floor(
                (
                    points.length - 1
                ) / 2
            ),

            points.length - 1
        ];


    let xLabels = "";


    labelIndexes.forEach(
        i => {

            const p =
                points[i];


            xLabels += `

                <text
                    x="${x(i)}"
                    y="${height-13}"
                    text-anchor="middle"
                    fill="#748195"
                    font-size="13"
                >

                    ${p.label}

                </text>
            `;
        }
    );


    return `

        <svg
            viewBox="0 0 ${width} ${height}"
            preserveAspectRatio="none"
        >

            ${grid}


            <polyline
                points="${polyline}"
                fill="none"
                stroke="#d8e1ec"
                stroke-width="4"
                stroke-linecap="round"
                stroke-linejoin="round"
            />


            ${xLabels}

        </svg>
    `;
}


/* =========================
   MARKET PAGE
========================= */

function marketPage(
    asset,
    periodLabel,
    points,
    change
) {

    if (
        !points ||
        points.length < 2
    ) {
        return;
    }


    const cls =
        directionClass(
            change
        );


    const priceLabel =
        asset.type === "fund"
        ?
        "基準価額"
        :
        "株価";


    addPage(`

        <div class="market-page">

            <div class="eyebrow">
                ${periodLabel}
            </div>


            <div class="market-top">

                <div>

                    <div class="market-name">
                        ${asset.name}
                    </div>

                    <div class="market-price">

                        ${priceLabel}

                        ${priceYen(
                            asset.price
                        )}

                        ・

                        ${asset.qtyLabel}

                    </div>

                </div>


                <div
                    class="
                        market-change
                        ${cls}
                    "
                >

                    ${arrow(change)}

                    ${percent(change)}

                </div>

            </div>


            <div class="chart-card">

                ${chartHTML(
                    points
                )}

            </div>

        </div>
    `);
}


/* =========================
   NEWS
========================= */

function newsPage(asset) {

    if (
        !asset.news ||
        asset.news.length === 0
    ) {
        return;
    }


    const n =
        asset.news[0];


    addPage(`

        <div class="news-page">

            <div class="eyebrow">
                ${asset.name} NEWS
            </div>


            <div class="news-card">

                <div class="news-date">
                    ${n.date || ""}
                </div>

                <div class="news-title">
                    ${n.title || ""}
                </div>

                <div class="news-description">
                    ${n.description || ""}
                </div>

                <div class="news-source">

                    ${
                        n.link
                        ?
                        `
                        <a
                            class="news-link"
                            href="${n.link}"
                            target="_blank"
                        >
                            ${
                                n.source ||
                                "記事を開く"
                            }
                        </a>
                        `
                        :
                        (
                            n.source ||
                            ""
                        )
                    }

                </div>

            </div>

        </div>
    `);
}


/* =========================
   BUILD PAGES
========================= */

function buildPages(data) {

    screen.innerHTML =
        "";


    pages =
        [];


    /*
      1. 天気
    */

    weatherPage(
        data
    );


    /*
      2. 総資産
    */

    totalSummaryPage(
        data
    );


    /*
      3. 日本株一覧
    */

    stockSummaryPage(
        data
    );


    /*
      4. 投資信託一覧
    */

    fundSummaryPage(
        data
    );


    /*
      5. 個別資産
    */

    (
        data.assets ||
        []
    )
    .forEach(
        asset => {


            /*
              日本株だけ1 DAY
            */

            if (
                asset.type === "stock"
                &&
                asset.intraday
                &&
                asset.intraday.length >= 2
            ) {

                marketPage(
                    asset,
                    "1 DAY",
                    asset.intraday,
                    asset.change
                );
            }


            /*
              1 WEEK
            */

            if (
                asset.week
                &&
                asset.week.length >= 2
            ) {

                marketPage(
                    asset,
                    "1 WEEK",
                    asset.week,
                    asset.weekChange
                );
            }


            /*
              1 MONTH
            */

            if (
                asset.month
                &&
                asset.month.length >= 2
            ) {

                marketPage(
                    asset,
                    "1 MONTH",
                    asset.month,
                    asset.monthChange
                );
            }


            /*
              NEWS
            */

            newsPage(
                asset
            );

        }
    );


    if (
        pages.length
    ) {

        pages[0]
        .classList.add(
            "active"
        );
    }


    pageIndex =
        0;


    if (
        pageTimer
    ) {

        clearInterval(
            pageTimer
        );
    }


    /*
      20秒ごとに切替
    */

    pageTimer =
        setInterval(
            nextPage,
            20000
        );
}


/* =========================
   PAGE ROTATION
========================= */

function nextPage() {

    if (
        pages.length <= 1
    ) {
        return;
    }


    pages[
        pageIndex
    ]
    .classList.remove(
        "active"
    );


    pageIndex =
        (
            pageIndex + 1
        )
        %
        pages.length;


    pages[
        pageIndex
    ]
    .classList.add(
        "active"
    );
}


/* =========================
   DATA LOAD
========================= */

async function loadData() {

    try {

        const response =
            await fetch(
                "data.json?t="
                +
                Date.now()
            );


        const data =
            await response.json();


        document
        .getElementById(
            "updated"
        )
        .textContent =
            "更新 "
            +
            data.updated_at;


        buildPages(
            data
        );

    }

    catch (error) {

        console.error(
            "data.json load error:",
            error
        );
    }
}


/* =========================
   CLOCK
========================= */

function updateClock() {

    const now =
        new Date();


    const text =
        now.toLocaleString(
            "ja-JP",
            {
                month:
                    "2-digit",

                day:
                    "2-digit",

                hour:
                    "2-digit",

                minute:
                    "2-digit"
            }
        );


    document
    .getElementById(
        "clock"
    )
    .textContent =
        text;
}


updateClock();

setInterval(
    updateClock,
    1000
);


loadData();

setInterval(
    loadData,
    15 * 60 * 1000
);

</script>
